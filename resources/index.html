}

/* 详情页正文 */
function pdPostHTML(p, commentCount) {
  var acc = S.accounts[p.authorId] || {};
  var name = acc.displayName || p.authorDisplayName || acc.handle || p.authorHandle || "Unknown";
  var handle = acc.handle || p.authorHandle || ("@" + (p.authorId || "user"));
  var atts = Array.isArray(p.attachments) ? p.attachments : [];
  var bodyText = p.text || "";
  var repostMark = '';
  /* 【修复·转推卡片】详情页同样显示原作者 */
  var rt = rtOriginInfo(p);
  var hName = name, hHandle = handle, hTime = p.createdAtMs, hAuthorId = p.authorId;
  if (rt) {
    repostMark = '<div class="pd-quote-head">' + SVG.repost + ' ' + esc(name) + ' 转推了</div>';
    bodyText = rt.text;
    if (rt.attachments.length) atts = rt.attachments;
    hName = rt.name; hHandle = rt.handle; hTime = rt.time; hAuthorId = rt.authorId;
  }
  var liked2 = (p.likedBy || []).indexOf(S.me) >= 0;
  var reposted2 = (p.retweetedBy || []).indexOf(S.me) >= 0;
  var bookmarked2 = (p.bookmarkedBy || []).indexOf(S.me) >= 0;
  var acts2 = '<div class="pd-actions">' +
    '<button class="action-btn repost' + (reposted2 ? ' reposted' : '') + '" data-pd-act="repost" data-id="' + esc(p.id) + '">' + SVG.repost + '</button>' +
    '<button class="action-btn like' + (liked2 ? ' liked' : '') + '" data-pd-act="like" data-id="' + esc(p.id) + '">' + (liked2 ? SVG.heartFilled : SVG.heart) + '</button>' +
    '<button class="action-btn' + (bookmarked2 ? ' bookmarked' : '') + '" data-pd-act="bookmark" data-id="' + esc(p.id) + '">' + (bookmarked2 ? SVG.bookmarkFilled : SVG.bookmark) + '</button>' +
    '</div>';
  return '<div class="pd-post">' +
    '<div class="pd-author">' +
      '<div class="avatar" style="' + avatarStyle(hAuthorId) + '" data-goto-author="' + esc(hAuthorId) + '">' +
        avatarInner(hAuthorId) +
      '</div>' +
      '<div class="pd-author-main">' +
        '<div>' +
          '<span class="pd-name" data-goto-author="' + esc(hAuthorId) + '">' + esc(hName) + '</span>' +
          (hAuthorId === "ai" ? SVG.verified : '') +
          '<span class="pd-handle">' + esc(hHandle) + '</span>' +
          '<span class="pd-time">' + esc(relTime(hTime)) + '</span>' +
        '</div>' +
        (repostMark ? repostMark : '') +
        (bodyText ? '<div class="pd-text">' + pdLinkify(bodyText) + '</div>' : '') +
      '</div>' +
    '</div>' +
    pdMediaHTML(atts) +
    (!rt ? pdQuoteHTML(p) : '') +
    pdStatsHTML(p, commentCount) +
    acts2 +
    '</div>';
}

/* 详情页渲染 */
function pdRender() {
  var body = document.getElementById("pdBody");
  var title = document.getElementById("pdTitle");
  if (!body) return;
  var p = PD.post;
  if (!p) {
    if (PD.loading) {
      body.innerHTML = '<div class="pd-msg">正在加载推文…</div>';
    } else {
      body.innerHTML = '<div class="pd-msg">' +
        '<div>' + esc(PD.error || '该推文不存在或已被删除') + '</div>' +
        '<div class="pd-retry" data-pd-retry="1">重试</div>' +
        '</div>';
    }
    if (title) title.textContent = '推文详情';
    return;
  }
  var acc = S.accounts[p.authorId] || {};
  var name = acc.displayName || p.authorDisplayName || acc.handle || p.authorHandle || "Unknown";
  if (title) title.textContent = name + ' · ' + relTime(p.createdAtMs);

  var list = Array.isArray(PD.comments) ? PD.comments : [];
  var html = pdPostHTML(p, list.length);
  html += '<div class="pd-replies-head">' +
    '<span>回复' + (list.length ? ' · ' + list.length : '') + '</span>' +
    '<button class="pd-toggle" data-pd-toggle="1">' + (PD.expanded ? '收起' : '展开') + '</button>' +
    '</div>';
  if (PD.expanded) {
    html += '<div class="pd-replies">';
    if (PD.loading) {
      html += '<div class="pd-empty">正在加载回复…</div>';
    } else if (list.length) {
      html += list.map(commentHTML).join('');
    } else {
      html += '<div class="pd-empty">还没有回复，来说点什么吧</div>';
    }
    if (PD.error) {
      html += '<div class="pd-empty">' + esc(PD.error) + '</div>';
    }
    html += commentFormHTML(p.id);
    html += '</div>';
  }
  body.innerHTML = html;
  pdBindCarousel();
}

/* 轮播滑动时同步页码与圆点 */
function pdBindCarousel() {
  var wrap = document.querySelector("#pdBody .pd-media");
  if (!wrap) return;
  var dots = document.querySelector("#pdBody .pd-dots");
  var slides = wrap.querySelectorAll(".pd-slide");
  if (!slides || slides.length < 2) return;
  var update = function () {
    var i = Math.round(wrap.scrollLeft / Math.max(1, wrap.clientWidth));
    if (i < 0) i = 0;
    if (i > slides.length - 1) i = slides.length - 1;
    var dotsEls = dots ? dots.querySelectorAll("i") : [];
    for (var k = 0; k < dotsEls.length; k++) {
      dotsEls[k].className = (k === i) ? "on" : "";
    }
    var counters = document.querySelectorAll("#pdBody .pd-counter");
    for (var c = 0; c < counters.length; c++) {
      counters[c].textContent = (i + 1) + "/" + slides.length;
    }
  };
  wrap.addEventListener("scroll", update);
  setTimeout(update, 60);
}

/* 打开二级详情页 */
function openPostDetail(postId) {
  var pd = document.getElementById("postDetail");
  if (!pd) { showToast('详情页不可用'); return; }
  PD.postId = String(postId || '');
  PD.post = pdFindPost(PD.postId);
  PD.comments = PD.post && Array.isArray(PD.post.comments) ? PD.post.comments.slice() : [];
  PD.loading = true;
  PD.error = '';
  PD.expanded = true;
  PD.tried = false;
  pd.classList.add('show');
  pd.setAttribute('aria-hidden', 'false');
  var sc = document.getElementById('pdScroll');
  if (sc) sc.scrollTop = 0;
  pdRender();

  /* 拉最新评论（失败时保留本地内容并提示） */
  XBridge.callTool("x_social:listComments", { postId: PD.postId }).then(function (r) {
    if (PD.postId !== String(postId)) return;   // 已经打开别的帖子了
    PD.loading = false;
    if (!r || r.success === false) {
      PD.error = (r && r.message) || '回复加载失败，可点击重试';
    } else {
      var d = (r && (r.data || r)) || {};
      PD.comments = Array.isArray(d.comments) ? d.comments : [];
      if (PD.post) { PD.post.comments = PD.comments; PD.post.commentCount = PD.comments.length; }
    }
    pdRender();
  }).catch(function () {
    if (PD.postId !== String(postId)) return;
    PD.loading = false;
    PD.error = '网络异常，暂时无法加载回复';
    pdRender();
  });

  /* 本地没有这条帖子 → 再从服务端全量列表里找一次 */
  if (!PD.post) {
    XBridge.callTool("x_social:status", { limit: 200 }).then(function (r) {
      if (PD.postId !== String(postId)) return;
      var d = (r && (r.data || r)) || {};
      var posts = Array.isArray(d.posts) ? d.posts : [];
      for (var i = 0; i < posts.length; i++) {
        if (posts[i] && String(posts[i].id) === String(postId)) {
          PD.post = posts[i];
          if (Array.isArray(posts[i].comments) && posts[i].comments.length) {
            PD.comments = posts[i].comments;
          }
          PD.loading = false;
          pdRender();
          return;
        }
      }
      PD.loading = false;
      PD.error = '该推文不存在或已被删除';
      pdRender();
    }).catch(function () {
      if (PD.postId !== String(postId)) return;
      PD.loading = false;
      PD.error = '网络异常，推文加载失败';
      pdRender();
    });
  }
}

/* 关闭二级详情页 */
function closePostDetail() {
  var pd = document.getElementById("postDetail");
  if (pd) {
    pd.classList.remove('show');
    pd.setAttribute('aria-hidden', 'true');
  }
  PD.postId = null;
  PD.post = null;
  PD.comments = [];
  PD.error = '';
}

/* ---------------- 事件绑定 ---------------- */
document.addEventListener("click", function (e) {
  var t = e.target;

  // ===== 评论：发送按钮 =====
  var cSend = t.closest && t.closest("[data-comment-send]");
  if (cSend) {
    e.stopPropagation();
    var cPostId = cSend.getAttribute("data-comment-send");
    /* 【修复·详情页评论框串台】首页卡片和详情页里可能有同 id 的评论框，
       document.querySelector 只会取到第一个（在首页卡片里），
       于是用户在详情页输入的内容根本没进详情页的输入框。
       这里先在「自己所在的评论容器」里找，找不到再退回全局查询。 */
    var cScope = cSend.closest(".comments-box, .pd-replies");
    var cInput = (cScope && cScope.querySelector('[data-comment-input="' + cPostId + '"]')) ||
      document.querySelector('[data-comment-input="' + cPostId + '"]');
    var cText = cInput ? String(cInput.value || "").trim() : "";
    if (!cText) { showToast("评论不能为空"); return; }
    cSend.disabled = true;
    cSend.textContent = "发送中";
    XBridge.callTool("x_social:comment", { postId: cPostId, text: cText, author: S.me }).then(function (r) {
      if (!r || r.success === false) {
        showToast((r && r.message) || "评论失败");
        cSend.disabled = false;
        cSend.textContent = "发送";
        return;
      }
      showToast("评论已发布");
      // 局部更新该帖的评论
      var d = (r.data || r) || {};
      var list = Array.isArray(d.comments) ? d.comments : null;
      if (!list && d.post && Array.isArray(d.post.comments)) list = d.post.comments;
      for (var i = 0; i < S.posts.length; i++) {
        if (S.posts[i].id === cPostId) {
          if (list) S.posts[i].comments = list;
          S.posts[i].commentCount = Number(d.commentCount) || (S.posts[i].comments || []).length;
          break;
        }
      }
      /* 【修复·详情页发评论会被踢回主页】
         旧实现无条件 renderHome()，而 renderHome() 会重建整个 elScroll，
         于是**详情页被整个抹掉**（用户看到的是"评论发出去了，但页面跳回主页"，
         输入框里的字也一并丢失，体感就是"评论发不了"）。
         现在：详情页开着 → 只刷新详情页；只有真的在主页视图才 renderHome()。 */
      var inDetail = (typeof PD !== "undefined" && PD.postId &&
        String(PD.postId) === String(cPostId));
      if (inDetail) {
        PD.comments = list || (PD.post && Array.isArray(PD.post.comments) ? PD.post.comments : []) || [];
        if (PD.post) { PD.post.comments = PD.comments; PD.post.commentCount = PD.comments.length; }
        PD.loading = false;
        PD.error = "";
        pdRender();
      } else if (S.view === "list" && S.tab === "home") {
        renderHome();
      }
      /* 清空输入框 + 恢复按钮（两种视图都要处理） */
      try {
        if (cInput) { cInput.value = ""; cInput.style.height = "auto"; }
        cSend.disabled = true;
        cSend.textContent = "发送";
      } catch (e) { }
      /* 【新增·社交事件桥接】评论成功后把事件送进绑定对话。
         ① 用户评论 → 通知 AI，AI 的回应回填成新评论
         ② AI 自己发的评论（fromBridge 的除外）→ 也通知
         回填返回的评论带 fromBridge 标记，前端不重复桥接，防无限循环。 */
      var cd = (r && (r.data || r)) || {};
      var theComment = cd.comment || null;
      var thePost = cd.post || null;
      /* 【需求·修正】只有**用户的评论**才通知 AI；
         AI 自己发的评论不再通知（否则回环 + 噪音）。
         桥接回填的评论带 fromBridge，同样不通知。 */
      if (theComment && thePost && !theComment.fromBridge && theComment.authorId !== "ai") {
        bridgeSocialEvent("user_comment", thePost, theComment);
      }
    });
    return;
  }

  // ===== 评论：输入框（启用/禁用发送按钮 + 自动高度） =====
  var cIn = t.closest && t.closest("[data-comment-input]");
  if (cIn && cIn.tagName === "TEXTAREA") {
    var pid2 = cIn.getAttribute("data-comment-input");
    var send2 = document.querySelector('[data-comment-send="' + pid2 + '"]');
    if (send2) send2.disabled = !String(cIn.value || "").trim();
    cIn.style.height = "auto";
    cIn.style.height = Math.min(cIn.scrollHeight, 100) + "px";
    return;
  }

  // 右下角悬浮发帖按钮
  if (t.closest && t.closest("#fabPost")) {
    openComposer();
    return;
  }

  // 返回
  if (t.closest && t.closest("#backBtn")) {
    if (typeof closePostDetail === "function") closePostDetail();
    S.view = "list";
    S.chatPeer = null;
    var bb = document.getElementById("backBtn");
    if (bb) bb.style.display = "none";
    elScroll.classList.remove("chat-mode");
    // 顶栏头像恢复成「我自己」（聊天页显示的是对方）
    updateMeAvatar();
    // 原版 X：从会话详情返回时回到原来的列表（私信 → Chat 列表）
    if (S.tab === "messages") {
      switchTab("messages");
    } else {
      switchTab("home");
    }
    return;
  }


  // 左上角头像 → 我的主页
  if (t.closest && t.closest("[data-open-profile]")) {
    renderProfile(S.me);
    return;
  }

  // 点击弹层背景关闭
  if (t.id === "modalMask") {
    if (t.classList.contains("compose")) closeComposer();
    else closeSheet();
    return;
  }

  // 主题
  if (t.closest && t.closest("#themeBtn")) {
    var root = document.documentElement;
    var cur = document.body.getAttribute("data-theme") || "light";
    var next = cur === "dark" ? "light" : "dark";
    document.body.setAttribute("data-theme", next);
    try { localStorage.setItem("x_theme", next); } catch (er) { }
    return;
  }

  // 底部 Tab
  var tab = t.closest && t.closest(".tab");
  if (tab) {
    var name = tab.getAttribute("data-tab");
    if (name) switchTab(name);
    return;
  }

  // 媒体选择
  var pk = t.closest && t.closest("[data-pick]");
  if (pk) {
    handlePick(pk.getAttribute("data-pick"));
    return;
  }

  // 删除预览媒体
  var rm = t.closest && t.closest("[data-rm]");
  if (rm) {
    var idx = Number(rm.getAttribute("data-rm"));
    S.pendingMedia.splice(idx, 1);
    renderMediaPreview();
    var sb = document.getElementById("composePost") || document.getElementById("sendBtn");
    var ci = document.getElementById("composerInput");
    if (sb) sb.disabled = !(ci && ci.value.trim()) && !S.pendingMedia.length;
    return;
  }

  // 点头像/名字 → 个人主页
  var ga = t.closest && t.closest("[data-goto-author]");
  if (ga) {
    e.stopPropagation();
    /* 从详情页点头像进主页 → 先关掉详情页，否则会被盖住 */
    if (typeof closePostDetail === "function") closePostDetail();
    renderProfile(ga.getAttribute("data-goto-author"));
    return;
  }

  // 帖子动作
  var act = t.closest && t.closest("[data-act]");
  if (act) {
    e.stopPropagation();
    var action = act.getAttribute("data-act");
    var pid = act.getAttribute("data-id");
    /* 【性能·局部更新】点赞/转发/收藏/删除：
       旧实现 = 调工具 → 全量拉 status → renderHome() 重建整个首页
       → 十几张图片全部重新解码，体感就是「按一下卡一下」。
       新实现 = 调工具 → 只用返回的那条帖子数据局部替换 .post-actions。
       若局部替换失败（帖子不在当前页）才回退到 refreshFeed()。 */
    if (action === "like" || action === "repost" || action === "bookmark") {
      var tool = action === "like" ? "x_social:like"
        : (action === "repost" ? "x_social:retweet" : "x_social:bookmark");
      /* 乐观更新：先切换图标给即时反馈，失败再回滚 */
      var optimistic = postById(pid);
      if (optimistic) {
        var arr = optimistic[action === "like" ? "likedBy"
          : (action === "repost" ? "retweetedBy" : "bookmarkedBy")] || [];
        var had = arr.indexOf(S.me) >= 0;
        var copy = arr.slice();
        if (had) copy.splice(copy.indexOf(S.me), 1); else copy.push(S.me);
        optimistic[action === "like" ? "likedBy"
          : (action === "repost" ? "retweetedBy" : "bookmarkedBy")] = copy;
        optimistic[action === "like" ? "likeCount"
          : (action === "repost" ? "retweetCount" : "bookmarkCount")] =
          Math.max(0, Number(optimistic[action === "like" ? "likeCount"
            : (action === "repost" ? "retweetCount" : "bookmarkCount")] || 0) + (had ? -1 : 1));
        patchPostActions(optimistic);
      }
      XBridge.callTool(tool, { postId: pid, actor: S.me }).then(function (r) {
        if (!r || r.success === false) {
          showToast((r && r.message) || "操作失败");
          refreshFeed();
          return;
        }
        var d = (r && (r.data || r)) || {};
        var np = d.post || null;
        if (np && np.id) {
          /* 用服务端返回的权威数据覆盖本地，再局部刷新 */
          var local = postById(np.id);
          if (local) {
            local.likedBy = np.likedBy || local.likedBy || [];
            local.retweetedBy = np.retweetedBy || local.retweetedBy || [];
            local.bookmarkedBy = np.bookmarkedBy || local.bookmarkedBy || [];
            local.likeCount = np.likeCount;
            local.retweetCount = np.retweetCount;
            local.bookmarkCount = np.bookmarkCount;
            patchPostActions(local);
          } else {
            refreshFeed();
          }
        } else {
          refreshFeed();
        }
        if (action === "bookmark") showToast("收藏状态已切换");
      });
      return;
    }
    if (action === "delete") {
      askConfirm("删除这条帖子？", function () {
        XBridge.callTool("x_social:deletePost", { postId: pid }).then(function () {
          showToast("已删除");
          refreshFeed();
        });
      });
    } else if (action === "comment") {
      /* 【需求·二级界面】点评论不再在原卡片里内联展开，
         直接打开全屏的推文详情页（回复时间线在详情页底部）。 */
      openPostDetail(pid);
    } else if (action === "reply") {
      showToast("请点击评论按钮展开评论区");
    }
    return;
  }
  /* ===== 帖子二级详情页：点击帖子正文/时间打开详情 =====
     注意：图片/视频（data-img / data-video）与头像/昵称要先被上面的分支拦掉，
     否则点图片会误跳详情、点昵称进不了主页。 */
  var pdImg = t.closest && t.closest("[data-img]");
  var pdVid = t.closest && t.closest("[data-video]");
  if (!pdImg && !pdVid) {
    var pdPost = t.closest && t.closest("[data-post]");
    if (pdPost) {
      e.stopPropagation();
      openPostDetail(pdPost.getAttribute("data-post"));
      return;
    }
  }
  /* 详情页内的互动按钮：点赞 / 转发 / 收藏 */
  var pdAct = t.closest && t.closest("[data-pd-act]");
  if (pdAct) {
    e.stopPropagation();
    var paId = pdAct.getAttribute("data-id");
    var paKind = pdAct.getAttribute("data-pd-act");
    var paTool = paKind === "like" ? "x_social:like" : (paKind === "repost" ? "x_social:retweet" : "x_social:bookmark");
    XBridge.callTool(paTool, { postId: paId, actor: S.me }).then(function (r) {
      if (!r || r.success === false) {
        showToast((r && r.message) || "操作失败");
        return;
      }
      /* 【性能·局部更新】用服务端返回的最新帖子数据刷新详情页，
         不再 refreshFeed() 全量重绘首页（那会把十几张图全部重新解码）。 */
      var d = (r && (r.data || r)) || {};
      var np = d.post || d;
      if (np && np.id && PD.post && String(np.id) === String(PD.postId)) {
        PD.post = np;
        pdRender();
      }
      /* 首页那条帖子也同步一下操作栏状态（只替换那一个 DOM 节点） */
      var local = postById(paId);
      if (local && np && np.id) {
        local.likedBy = np.likedBy || local.likedBy || [];
        local.retweetedBy = np.retweetedBy || local.retweetedBy || [];
        local.bookmarkedBy = np.bookmarkedBy || local.bookmarkedBy || [];
        local.likeCount = np.likeCount;
        local.retweetCount = np.retweetCount;
        local.bookmarkCount = np.bookmarkCount;
        patchPostActions(local);
      }
    });
    return;
  }
  /* 详情页内部：返回 / 展开收起 / 重试 */
  var pdBack = t.closest && t.closest("#pdBack");
  if (pdBack) {
    closePostDetail();
    return;
  }
  var pdTgl = t.closest && t.closest("[data-pd-toggle]");
  if (pdTgl) {
    PD.expanded = !PD.expanded;
    pdRender();
    return;
  }
  var pdRetry = t.closest && t.closest("[data-pd-retry]");
  if (pdRetry) {
    var again = PD.postId;
    if (again) openPostDetail(again);
    return;
  }

  // 私信会话
  var chat = t.closest && t.closest("[data-chat]");
  if (chat) {
    openChat(chat.getAttribute("data-chat"));
    return;
  }
  // 新私信
  if (t.closest && t.closest("#dmNewBtn")) {
    var di = document.getElementById("dmNewInput");
    var who = di ? String(di.value || "").trim().toLowerCase() : "";
    if (!who) { showToast("请输入 user 或 ai"); return; }
    var peer = who.indexOf("ai") >= 0 ? "ai" : "user";
    if (peer === S.me) { showToast("不能给自己发私信"); return; }
    openChat(peer);
    return;
  }

  // 顶栏「All ⌄」筛选按钮
  if (t.closest && t.closest("#dmFilterBtn")) {
    toggleDmFilter();
    return;
  }


  // 【性能·长文本折叠】点「…展开」显示全文
  var exp = t.closest && t.closest("[data-expand]");
  if (exp) {
    var span = exp.closest(".bubble-text");
    if (span) {
      var full = span.getAttribute("data-full") || "";
      if (full) {
        // 直接换成全文（data-full 里是已转义的原文，插入前不再转义）
        span.innerHTML = full;
        span.removeAttribute("data-full");
        span.removeAttribute("data-collapsed");
      }
    }
    return;
  }

  // 图片/视频放大（进入查看器，可左右滑动浏览该帖的全部图片）
  var im = t.closest && t.closest("[data-img]");
  if (im) {
    var mp = im.getAttribute("data-mp");
    var mi = Number(im.getAttribute("data-mi") || 0);
    var list = mp ? mediaListForPost(mp) : [];
    if (list.length) {
      openMediaViewer(list, mi);
    } else {
      openLightbox(im.getAttribute("data-img"), false);
    }
    return;
  }
  var vd = t.closest && t.closest("[data-video]");
  if (vd) {
    var vp = vd.getAttribute("data-mp");
    var vi = Number(vd.getAttribute("data-mi") || 0);
    var vlist = vp ? mediaListForPost(vp) : [];
    if (vlist.length) {
      openMediaViewer(vlist, vi);
    } else {
      openLightbox(vd.getAttribute("data-video"), true);
    }
    return;
  }

  // 关闭灯箱（点关闭按钮 / 点空白）
  if (t.closest && t.closest(".lb-close")) {
    closeLightbox();
    return;
  }
  if (t.id === "lightbox") {
    closeLightbox();
    return;
  }
  // 点导航箭头：只切换，不关闭
  var lbn = t.closest && t.closest(".lb-nav");
  if (lbn) return;
  // 点查看器空白处：关闭
  if (t.id === "lb-stage" || (t.classList && t.classList.contains("lb-stage"))) {
    closeLightbox();
    return;
  }
});

function switchTab(name) {
  /* 切换 Tab 时若详情页开着，先关闭 */
  if (typeof closePostDetail === "function") closePostDetail();
  S.tab = name;
  S.view = "list";
  elScroll.classList.remove("chat-mode");
  /* 【性能】离开聊天界面 → 恢复首页轮询
     （进入聊天时 openChat 会停掉它，避免和聊天加载抢 IO） */
  startFeedPoller();
  var bb = document.getElementById("backBtn");
  if (bb) bb.style.display = "none";
  // 「All ⌄」筛选按钮只在私信页出现
  setDmFilterVisible(name === "messages");
  document.querySelectorAll(".tab").forEach(function (b) {
    b.classList.toggle("active", b.getAttribute("data-tab") === name);
  });
  if (name === "home") {
    renderHome();
    refreshFeed();
  } else if (name === "search") {
    renderSearch();
  } else if (name === "notifications") {
    renderNotifications();
    // 进通知页就算已读：markNotificationsRead 内部会先刷新列表再标记，
    // 角标小蓝点随之清掉（之前后端没有写 read 的路径，永远消不掉）
    markNotificationsRead();
  } else if (name === "messages") {
    renderMessages();
    refreshThreads();
    loadChatOptions();
  }
}

/* ---------------- 启动 ---------------- */
(function boot() {
  try {
    var saved = localStorage.getItem("x_theme");
    if (saved) document.body.setAttribute("data-theme", saved);
  } catch (e) { }
  renderHome();
  // 桥接通常几百毫秒内就绪：先快轮询，之后放宽，避免一直 250ms 空转
  var tries = 0;
  var timer = null;
  function tick() {
    tries++;
    if (XBridge.ready()) {
      if (timer) clearTimeout(timer);
      timer = null;
      XBridge.log("bridge ready");
      // 三个请求并发发出，且首屏只需要 status
      refreshFeed();
      setTimeout(refreshNotifications, 60);
      setTimeout(refreshThreads, 120);
      /* 【修复·社交事件桥接收不到】boot 阶段必须加载绑定对话。
         原来只在切到「消息」标签时才调 loadChatOptions()，
         于是 S.chatLinks 一直是空的 → bridgeSocialEvent 里
         `var chatId = String(links["ai"] || "")` 拿到空串 →
         直接 return「未绑定对话」→ 事件被静默丢弃 → 用户感觉「AI 收不到」。
         这里在启动时就拉一次绑定，之后发帖/评论才有目标对话。 */
      loadChatOptions();
      // 预热两个账号的主页缓存，打开个人主页时先秒出缓存再静默刷新
      setTimeout(function () { prefetchProfile("user"); prefetchProfile("ai"); }, 200);
      // 【修复】开启定时同步：AI/工具侧发帖后前端自动出现，不用手动刷新
      startFeedPoller();
      // 【新增】启动社交事件队列泵：AI 用工具发的帖子/评论由它投递进绑定对话
      startSocialQueuePump();
      return;
    }
    if (tries > 60) {
      showToast("桥接未就绪，界面可能无法操作");
      return;
    }
    timer = setTimeout(tick, tries < 12 ? 40 : (tries < 30 ? 120 : 300));
  }
  timer = setTimeout(tick, 0);
})();
</script>
</body>
</html>
