<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>X</title>
<style>
  :root {
    --x-blue: #1d9bf0;
    --success-green: #00ba7c;
    --like-pink: #f91880;
    --bg: #ffffff;
    --surface: #f7f9f9;
    --hover: #eff3f4;
    --border: #eff3f4;
    --text-primary: #0f1419;
    --text-secondary: #536471;
    --text-tertiary: #829aab;
    --nav-h: 54px;
    --tab-h: 54px;
    --font-main: "TwitterChirp", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  [data-theme="dark"] {
    --bg: #000000;
    --surface: #16181c;
    --hover: #1d1f23;
    --border: #2f3336;
    --text-primary: #e7e9ea;
    --text-secondary: #71767b;
    --text-tertiary: #536471;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font-main);
    font-size: 15px;
    line-height: 1.35;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea { font-family: inherit; }
  svg { display: block; flex-shrink: 0; }
  a { color: var(--x-blue); text-decoration: none; }

  /* ================= 布局 ================= */
  #app { position: relative; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  .topbar {
    height: var(--nav-h);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 14px;
    /* 【性能】原来用 backdrop-filter: blur(12px) 做毛玻璃。
       在 Android WebView 里，backdrop-filter 会强制整块区域走 GPU 离屏渲染，
       每滚动一帧都要重算模糊 —— 聊天界面长列表滚动时非常吃 CPU。
       改成不透明背景（视觉差异极小），滚动明显更顺。 */
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    position: relative;
    z-index: 20;
  }
  .topbar .avatar { width: 34px; height: 34px; font-size: 13px; }
  .topbar h1 { font-size: 19px; font-weight: 800; flex: 1; }
  .topbar .spacer { flex: 1; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 9999px;
    display: grid; place-items: center; transition: background .15s;
  }
  .icon-btn:hover, .icon-btn:active { background: var(--hover); }
  .icon-btn svg { width: 21px; height: 21px; fill: var(--text-primary); }
  .back-btn { margin-left: -6px; }

  .scroll-area { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
  .scroll-area::-webkit-scrollbar { width: 0; }

  /* 底部 Tab */
  .tabbar {
    height: var(--tab-h);
    flex-shrink: 0;
    display: flex;
    align-items: stretch;
    border-top: 1px solid var(--border);
    background: var(--bg);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    position: relative;
    color: var(--text-secondary);
    transition: color .15s;
  }
  .tab svg { width: 24px; height: 24px; fill: currentColor; }
  .tab .tab-label { font-size: 10px; font-weight: 500; }
  .tab.active { color: var(--text-primary); }
  .tab.active svg { fill: var(--text-primary); }
  .tab .badge {
    position: absolute;
    top: 6px;
    left: 50%;
    margin-left: 6px;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    border-radius: 9999px;
    background: var(--x-blue);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    display: none;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .tab .badge.show { display: flex; }

  /* ================= 通用 ================= */
  .avatar {
    width: 44px; height: 44px;
    border-radius: 9999px;
    flex-shrink: 0;
    display: grid; place-items: center;
    color: #fff; font-weight: 700; font-size: 16px;
    user-select: none; overflow: hidden;
  }
  .avatar.sm { width: 36px; height: 36px; font-size: 13px; }
  .avatar.lg { width: 76px; height: 76px; font-size: 26px; border: 3px solid var(--bg); }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  .verified { width: 17px; height: 17px; fill: var(--x-blue); flex-shrink: 0; }

  /* ================= 发帖框 ================= */
  .composer {
    display: flex; gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }
  .composer-body { flex: 1; min-width: 0; }
  .composer textarea {
    width: 100%;
    min-height: 46px;
    max-height: 180px;
    resize: none;
    border: none; outline: none;
    background: transparent;
    color: var(--text-primary);
    font-size: 18px;
    line-height: 1.4;
    padding: 6px 0;
  }
  .composer textarea::placeholder { color: var(--text-secondary); }
  .composer-actions {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 8px; border-top: 1px solid var(--border); margin-top: 4px;
  }
  .composer-tools { display: flex; gap: 2px; }
  .tool-btn {
    width: 34px; height: 34px; border-radius: 9999px;
    display: grid; place-items: center; transition: background .15s;
  }
  .tool-btn:active { background: color-mix(in srgb, var(--x-blue) 14%, transparent); }
  .tool-btn svg { width: 20px; height: 20px; fill: var(--x-blue); }
  .send-btn {
    padding: 0 18px; height: 34px; border-radius: 9999px;
    background: var(--x-blue); color: #fff;
    font-weight: 700; font-size: 14px;
    transition: opacity .15s, transform .1s;
  }
  .send-btn:active { transform: scale(.96); }
  .send-btn:disabled { opacity: .45; }

  /* 媒体预览 */
  #mediaPreview {
    display: none; gap: 8px; flex-wrap: wrap; padding: 8px 0 0;
  }
  .media-chip { position: relative; }
  .media-chip img, .media-chip video {
    width: 74px; height: 74px; object-fit: cover;
    border-radius: 12px; display: block; background: #000;
  }
  .media-chip .rm {
    position: absolute; top: -5px; right: -5px;
    width: 20px; height: 20px; border-radius: 9999px;
    background: rgba(15,20,25,.92); color: #fff;
    font-size: 13px; line-height: 18px; text-align: center;
    display: grid; place-items: center;
  }

  /* ================= 帖子 ================= */
  .post {
    display: flex; gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    transition: background .15s;
    animation: fadeIn .2s ease;
  }
  .post:active { background: color-mix(in srgb, var(--hover) 70%, transparent); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .post-body { flex: 1; min-width: 0; }
  .post-header {
    display: flex; align-items: center; gap: 4px;
    flex-wrap: wrap; font-size: 15px; line-height: 1.3;
  }
  .post-name {
    font-weight: 700; color: var(--text-primary);
    cursor: pointer;
  }
  .post-name:active { text-decoration: underline; }
  .post-handle, .post-time, .post-dot { color: var(--text-secondary); font-weight: 400; font-size: 15px; }
  .post-text {
    font-size: 15px; line-height: 1.4; margin-top: 2px;
    white-space: pre-wrap; word-break: break-word;
    cursor: pointer;
  }
  .post-actions {
    display: flex; justify-content: space-between;
    margin-top: 10px; max-width: 400px;
  }
  .action-btn {
    display: flex; align-items: center; gap: 5px;
    color: var(--text-secondary); font-size: 13px;
    padding: 3px 7px; border-radius: 9999px;
    transition: background .15s, color .15s;
  }
  .action-btn svg { width: 17px; height: 17px; fill: currentColor; }
  .action-btn:active { background: color-mix(in srgb, var(--x-blue) 12%, transparent); }
  .action-btn.reply:active { color: var(--x-blue); }
  .action-btn.repost:active { color: var(--success-green); }
  .action-btn.like:active { color: var(--like-pink); }
  .action-btn.liked { color: var(--like-pink); }
  .action-btn.reposted { color: var(--success-green); }
  .action-btn.bookmarked { color: var(--x-blue); }
  .action-btn.liked svg { animation: heartPop .35s ease; }
  @keyframes heartPop { 0%{transform:scale(1)} 40%{transform:scale(1.35)} 70%{transform:scale(.9)} 100%{transform:scale(1)} }

  /* ---------------- 评论 ---------------- */
  .comments-box {
    margin-top: 10px; max-width: 400px;
    border-top: 1px solid var(--border);
    padding-top: 8px;
  }
  .comment-item {
    display: flex; gap: 8px; padding: 6px 0;
  }
  .comment-item .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 11px; font-weight: 700; flex-shrink: 0;
    overflow: hidden;
  }
  .comment-item .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .comment-main { flex: 1; min-width: 0; }
  .comment-head {
    display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap;
  }
  .comment-name { font-size: 13px; font-weight: 700; color: var(--text-primary); }
  .comment-handle { font-size: 12px; color: var(--text-secondary); }
  .comment-time { font-size: 12px; color: var(--text-tertiary); }
  .comment-text {
    font-size: 14px; line-height: 1.4; color: var(--text-primary);
    white-space: pre-wrap; word-break: break-word; margin-top: 2px;
  }
  .comment-form {
    display: flex; gap: 8px; align-items: flex-start; margin-top: 8px;
  }
  .comment-form .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 11px; font-weight: 700; flex-shrink: 0;
    overflow: hidden;
  }
  .comment-form .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .comment-input-wrap {
    flex: 1; display: flex; align-items: center; gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border); border-radius: 9999px;
    padding: 5px 6px 5px 12px;
  }
  .comment-input {
    flex: 1; border: none; outline: none; background: transparent;
    color: var(--text-primary); font-size: 14px; line-height: 1.4;
    min-width: 0; resize: none; font-family: inherit;
    max-height: 100px;
  }
  .comment-input::placeholder { color: var(--text-tertiary); }
  .comment-send {
    border: none; border-radius: 9999px; background: var(--x-blue);
    color: #fff; font-size: 13px; font-weight: 700;
    padding: 5px 13px; cursor: pointer;
  }
  .comment-send:disabled { opacity: .45; cursor: default; }
  .comments-empty {
    font-size: 13px; color: var(--text-tertiary); padding: 6px 0 2px;
  }

  .comment-toggle {
    font-size: 13px; color: var(--text-secondary); cursor: pointer;
    margin-top: 8px; display: inline-flex; align-items: center; gap: 4px;
  }
  .comment-toggle:active { color: var(--x-blue); }

  /* 媒体网格 */
  .post-media { margin-top: 8px; display: grid; gap: 2px; border-radius: 14px; overflow: hidden; }
  .post-media.one { grid-template-columns: 1fr; }
  .post-media.two { grid-template-columns: 1fr 1fr; }
  /* 3 张：首图占左列并跨两行，右列上下各一张（还原 X 原生版式） */
  .post-media.three { grid-template-columns: 1fr 1fr; grid-template-rows: auto auto; }
  .post-media.three > :first-child { grid-row: 1 / span 2; }
  /* 4 张：2×2 */
  .post-media.four { grid-template-columns: 1fr 1fr; }
  /* 5 张及以上：3 列自适应 */
  .post-media.many { grid-template-columns: repeat(3, 1fr); }
  /* 超多图（>9）：仍然 3 列，全部渲染，不截断 */
  .post-media.many .mi { aspect-ratio: 1/1; }
  .post-media .mi {
    width: 100%; aspect-ratio: 16/10; object-fit: cover;
    display: block; background: var(--surface); cursor: pointer;
  }
  .post-media.two .mi { aspect-ratio: 1/1; }
  .post-media.three .mi { aspect-ratio: 1/1; }
  .post-media.four .mi { aspect-ratio: 1/1; }
  .media-video-wrap { position: relative; overflow: hidden; }
  /* 【修复·视频封面】没有 poster 时用渐变占位，避免整块纯黑 */
  .media-video-wrap .video-fallback {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(135deg, #2b3648 0%, #1a2130 60%, #121821 100%);
  }
  .media-video-wrap .play-badge {
    position: absolute; inset: 0; display: grid; place-items: center;
    pointer-events: none;
  }
  .media-video-wrap .play-badge svg { width: 44px; height: 44px; fill: rgba(255,255,255,.92); filter: drop-shadow(0 1px 6px rgba(0,0,0,.5)); }

  /* 转发条 */
  .repost-mark {
    display: flex; align-items: center; gap: 6px;
    color: var(--text-secondary); font-size: 13px; font-weight: 700;
    padding: 0 0 4px 0; margin-left: 26px;
  }
  .repost-mark svg { width: 15px; height: 15px; fill: currentColor; }

  /* ================= 通知 ================= */
  .ntf-row {
    display: flex; gap: 10px; padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    align-items: flex-start;
  }
  .ntf-icon { width: 30px; display: grid; place-items: center; padding-top: 10px; }
  .ntf-icon svg { width: 22px; height: 22px; }
  .ntf-main { flex: 1; min-width: 0; }
  .ntf-line { font-size: 15px; line-height: 1.35; }
  .ntf-line b { font-weight: 700; }
  .ntf-time { color: var(--text-secondary); font-size: 13px; margin-top: 3px; }
  /* 操作者头像（参考图：左侧圆头像 + 右侧文字） */
  .ntf-avatar {
    width: 40px; height: 40px; border-radius: 9999px;
    display: grid; place-items: center; overflow: hidden;
    color: #fff; font-weight: 700; font-size: 15px; flex: none;
  }
  .ntf-avatar img { width: 100%; height: 100%; object-fit: cover; }
  /* 顶部分段 Tab：All / Mentions / Verified */
  .ntf-tabs {
    display: flex; gap: 4px; padding: 8px 12px 0;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--bg); z-index: 5;
  }
  .ntf-tab {
    flex: 1; border: none; background: transparent; cursor: pointer;
    padding: 12px 8px 10px; font-size: 17px; color: var(--text-secondary);
    font-weight: 700; border-bottom: 3px solid transparent;
  }
  .ntf-tab.active { color: var(--text-primary); border-bottom-color: var(--x-blue); }
  /* 多人聚合头像（参考图：xiaojiang 及另外 3 人关注了你） */
  .ntf-avatars { display: flex; align-items: center; }
  .ntf-avatars .ntf-avatar { width: 32px; height: 32px; font-size: 13px; }
  .ntf-avatars .ntf-avatar + .ntf-avatar { margin-left: -10px; }
  .ntf-more {
    width: 32px; height: 32px; border-radius: 9999px; margin-left: -10px;
    background: var(--bg-secondary); color: var(--text-secondary);
    display: grid; place-items: center; font-size: 12px; font-weight: 700;
    border: 2px solid var(--bg);
  }

  /* ================= 私信 ================= */
  /* 【原版 X 风格】Chat 列表：大标题 + 圆角搜索框 + 大圆形头像会话行 */
  .pill-filter {
    display: inline-flex; align-items: center; gap: 4px;
    height: 32px; padding: 0 12px 0 14px; border-radius: 9999px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--text-primary); font-size: 15px; font-weight: 700;
    transition: background .15s;
  }
  .pill-filter:hover, .pill-filter:active { background: var(--hover); }
  .pill-filter svg { width: 18px; height: 18px; fill: var(--text-primary); }

  .dm-search {
    margin: 12px 12px 8px;
    display: flex; align-items: center; gap: 10px;
    height: 44px; padding: 0 14px; border-radius: 9999px;
    background: var(--surface); color: var(--text-tertiary);
    border: 1px solid transparent;
  }
  .dm-search:focus-within { border-color: var(--x-blue); background: var(--bg); }
  .dm-search svg { width: 20px; height: 20px; fill: var(--text-tertiary); flex-shrink: 0; }
  .dm-search input {
    flex: 1; min-width: 0; border: none; outline: none; background: transparent;
    color: var(--text-primary); font-size: 16px; font-family: inherit;
  }
  .dm-search input::placeholder { color: var(--text-tertiary); }

  .dm-row {
    display: flex; gap: 12px; padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    align-items: center; cursor: pointer;
  }
  .dm-row:active { background: var(--hover); }
  /* 原版 X 的会话头像是 3:1 的大圆角方形 */
  .dm-row .avatar {
    width: 48px; height: 48px; border-radius: 50%;
    font-size: 18px; flex-shrink: 0;
  }
  .dm-main { flex: 1; min-width: 0; }
  .dm-top { display: flex; align-items: center; gap: 4px; }
  .dm-name { font-weight: 700; font-size: 15px; }
  .dm-handle, .dm-time { color: var(--text-secondary); font-size: 14px; }
  .dm-time { margin-left: auto; font-size: 13px; }
  .dm-preview {
    color: var(--text-secondary); font-size: 14px;
    margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .dm-preview.unread { color: var(--text-primary); font-weight: 600; }
  .dm-unread-dot {
    width: 8px; height: 8px; border-radius: 9999px;
    background: var(--x-blue); flex-shrink: 0; margin-left: 6px;
  }
  /* 原版 X 风格：绑定条放在搜索框下方，用浅色圆角卡片 */
  .dm-bind-card {
    margin: 0 12px 12px; padding: 10px 12px;
    border-radius: 16px; background: var(--surface);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .dm-bind-card .dot { width: 7px; height: 7px; border-radius: 9999px; background: #bbb; flex-shrink: 0; }
  .dm-bind-card .dot.on { background: var(--success-green); }
  .dm-bind-card .bind-label { font-size: 13px; color: var(--text-secondary); flex: 1; min-width: 120px; }
  .dm-bind-card select {
    flex: 1; min-width: 140px; height: 32px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--text-primary); font-size: 13px; padding: 0 8px;
    outline: none; font-family: inherit;
  }
  .dm-bind-card select:focus { border-color: var(--x-blue); }

  /* 聊天视图 */
  #chatView { display: flex; flex-direction: column; height: 100%; }
  .chat-head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    background: var(--bg); flex-shrink: 0;
  }
  .chat-list {
    flex: 1; overflow-y: auto; padding: 12px 14px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .bubble-row { display: flex; gap: 8px; align-items: flex-end; max-width: 100%; }
  /* 【新增·日期分隔线】 */
  .chat-day-sep {
    display: flex; justify-content: center; margin: 12px 0 8px;
  }
  .chat-day-sep span {
    font-size: 12px; font-weight: 700; color: var(--text-secondary);
    background: var(--surface); border: 1px solid var(--border);
    padding: 3px 12px; border-radius: 9999px;
  }
  .bubble-row.mine { flex-direction: row-reverse; }
  .bubble {
    max-width: 74%;
    padding: 9px 13px;
    border-radius: 20px;
    font-size: 15px; line-height: 1.35;
    background: var(--surface);
    color: var(--text-primary);
    word-break: break-word; white-space: pre-wrap;
  }
  .bubble-row.mine .bubble {
    background: var(--x-blue); color: #fff;
    border-bottom-right-radius: 6px;
  }
  .bubble-row.theirs .bubble { border-bottom-left-radius: 6px; }
  /* 【性能·长文本折叠】展开按钮 */
  .bubble-more {
    color: var(--x-blue); font-size: 13px; font-weight: 700;
    padding: 0; margin-left: 2px; background: none; font-family: inherit;
  }
  .bubble-row.mine .bubble-more { color: #fff; opacity: .9; }
  .bubble-text { white-space: pre-wrap; }
  .bubble img, .bubble video { max-width: 200px; border-radius: 14px; display: block; margin-top: 4px; }
  .chat-input-row {
    flex-shrink: 0; display: flex; align-items: flex-end; gap: 8px;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border); background: var(--bg);
  }
  .chat-input-row textarea {
    flex: 1; min-height: 38px; max-height: 110px; resize: none;
    border: 1px solid var(--border); outline: none;
    background: var(--surface); color: var(--text-primary);
    border-radius: 20px; padding: 9px 14px; font-size: 15px; line-height: 1.3;
  }

  /* ================= 个人主页 ================= */
  .profile-head { position: relative; }
  .profile-banner {
    height: 120px;
    background: linear-gradient(135deg, #1d9bf0, #7856ff 55%, #f093fb);
  }
  .profile-body { padding: 0 14px 14px; position: relative; }

  /* 空状态 */
  .empty {

  /* 加载中 */
  .loading-row { padding: 40px; text-align: center; color: var(--text-secondary); font-size: 14px; }

  /* Toast */
  #toast {

    z-index: 999; max-width: 80vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 图片查看器 */
  #lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,.95);
    display: none; align-items: center; justify-content: center;

  /* ---------- 图片查看器（多图左右滑动） ---------- */
  #lightbox.lb-gallery { flex-direction: column; padding: 0; }
  .lb-stage {
    position: relative; width: 100%; flex: 1;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; touch-action: pan-y;
  }

  .lb-nav.prev { left: 12px; }
  .lb-nav.next { right: 12px; }

  }
  .lb-close {
    position: absolute; top: calc(12px + env(safe-area-inset-top));

  /* ================= 悬浮发帖按钮（官方右下角蓝圈白加号） ================= */
  .fab {
    position: absolute;

  /* 发帖 / 私信 编辑器铺满弹层 */

  }

<script>
/* ================================================================
   【防白屏】全局错误捕获：JS 一旦语法/运行出错，
   WebView 里就是一个"壳子"（顶栏在、内容空、按钮无响应），
   极难排查。这里把错误直接显示到页面上。
   ================================================================ */
(function () {
  window.__xErrors = [];
  function show(msg) {
    try {
      window.__xErrors.push(msg);
      var box = document.getElementById("xErrorBox");
      if (!box) {
        box = document.createElement("div");
        box.id = "xErrorBox";
        box.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:99999;" +
          "background:#b00020;color:#fff;font:12px/1.4 monospace;padding:8px;" +
          "max-height:40%;overflow:auto;white-space:pre-wrap;";
        document.body.appendChild(box);
      }
      box.textContent = "JS 错误:\n" + window.__xErrors.slice(-3).join("\n---\n");
    } catch (e) { }
  }
  window.addEventListener("error", function (e) {

var GRADS = {
  user: "linear-gradient(135deg,#667eea,#764ba2)",
  ai: "linear-gradient(135deg,#1d9bf0,#7856ff)"
};

function mediaUrl(p) {
  if (!p) return "";

  return "/file?path=" + encodeURIComponent(s);
}

/* ---------------- 本地文件 → base64（WebView 原生 input[type=file] 兜底） ---------------- */
function readAsDataURL(file) {
  return new Promise(function (resolve, reject) {
    try {
      var fr = new FileReader();
      fr.onload = function () { resolve(String(fr.result || "")); };
      fr.onerror = function () { reject(fr.error || new Error("读取失败")); };
      fr.readAsDataURL(file);
    } catch (e) { reject(e); }
  });
}

/* 图片压到长边 1440、JPEG 0.86，避免 base64 过大把桥接撑爆 */
function compressImage(file, maxSide, quality) {
  return readAsDataURL(file).then(function (dataUrl) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.onload = function () {
        try {
          var w = img.naturalWidth || img.width;
          var h = img.naturalHeight || img.height;
          var scale = Math.min(1, (maxSide || 1440) / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * scale));
          var ch = Math.max(1, Math.round(h * scale));
          var cv = document.createElement("canvas");
          cv.width = cw; cv.height = ch;
          cv.getContext("2d").drawImage(img, 0, 0, cw, ch);
          var out = cv.toDataURL("image/jpeg", quality || 0.86);
          resolve(out && out.length > 64 ? out : dataUrl);
        } catch (e) { resolve(dataUrl); }
      };
      img.onerror = function () { resolve(dataUrl); };
      img.src = dataUrl;
    });
  });
}

function pickViaInput(kind) {
  var id = kind === "video" ? "filePickVideo" : "filePickImage";
  var el = document.getElementById(id);
  if (!el) return Promise.resolve({ cancelled: true, files: [] });
  return new Promise(function (resolve) {
    var done = false;
    var blurred = false;
    function onBlur() { blurred = true; }
    function cleanup() {
      try { window.removeEventListener("blur", onBlur); } catch (e) { }
    }
    function finish(v) {
      if (done) return;
      done = true;
      cleanup();
      el.onchange = null;
      if (v && typeof v === "object") v.native = true;
      resolve(v);
    }
    el.value = "";
    el.onchange = function () {
      var list = el.files ? Array.prototype.slice.call(el.files) : [];
      if (!list.length) { finish({ cancelled: true, files: [] }); return; }
      /* 【修复·多图只显示 4 张·选图环节】
         旧实现：list.slice(0, 4) —— 选完图直接只取前 4 个文件，
         用户选 6 张，第 5、6 张在**选择阶段**就被丢掉了，
         连「已选 6 张」的提示都不会出现。
         新实现：全部处理。上限从 4 提到 9（与 X 原生一致），
         超过上限时给出明确提示，而不是静默丢弃。 */
      var MAX_MEDIA = 20;
      var picked = list.length > MAX_MEDIA ? list.slice(0, MAX_MEDIA) : list;
      var dropped = list.length - picked.length;
      if (dropped > 0) {
        try { showToast("最多 " + MAX_MEDIA + " 个，已忽略 " + dropped + " 个"); } catch (e) { }
      }
      var tasks = picked.map(function (f) {
        if (kind === "video") {
          if (Number(f.size) > 48 * 1024 * 1024) return Promise.resolve(null);
          return readAsDataURL(f).then(function (d) { return { data: d, name: f.name, type: "video" }; })
            .catch(function () { return null; });
        }
        return compressImage(f, 1440, 0.86).then(function (d) { return { data: d, name: f.name, type: "image" }; })
          .catch(function () { return null; });
      });
      Promise.all(tasks).then(function (arr) {
        var ok = arr.filter(function (x) { return x && x.data; });
        finish({ cancelled: !ok.length, files: ok, data: ok, dropped: dropped });
      });
    };
    try { window.addEventListener("blur", onBlur); } catch (e) { }
    try { el.click(); } catch (e) { finish({ cancelled: true, files: [] }); }
    // 宿主 WebView 可能没有接管 onShowFileChooser：页面没失焦就说明选择器根本没弹出
    setTimeout(function () {
      if (!done && !blurred) finish({ cancelled: true, files: [], message: "宿主未接管文件选择" });
    }, 1200);
    setTimeout(function () { if (!done) finish({ cancelled: true, files: [] }); }, 180000);
  });
}
/* 宿主文件选择器（ctx.openFilePicker）：返回本地绝对路径数组，最可靠 */
function pickFromHost(kind, multiple) {
  return XBridge.pickMedia(kind, multiple !== false).then(function (rr) {
    var cancelled = !!(rr && rr.cancelled);
    if (cancelled) return { files: [], cancelled: true, message: (rr && rr.message) || "" };
    var files = [];
    if (typeof rr === "string") files = [rr];
    else if (rr) files = Array.isArray(rr.files) ? rr.files : (Array.isArray(rr.paths) ? rr.paths : []);
    var out = [];
    files.forEach(function (f) {
      var p = typeof f === "string" ? f : (f && (f.path || f.filePath || f.uri) || "");
      if (p) out.push({ path: p, name: (f && f.name) || String(p).split("/").pop() || "" });
    });
    return { files: out, message: (rr && rr.message) || "" };
  });
}

var LB_STATE = { items: [], index: 0 };
function mediaListForPost(postId) {

function openMediaViewer(items, index) {

  LB_STATE.items = items;
  LB_STATE.index = Math.max(0, Math.min(items.length - 1, Number(index || 0)));

  lb.innerHTML =
    '<div class="lb-stage">' +
      '<button class="lb-nav prev" aria-label="上一张">&#8249;</button>' +
      '<div class="lb-view"></div>' +
      '<button class="lb-nav next" aria-label="下一张">&#8250;</button>' +

      '<button class="lb-close" aria-label="关闭">&#215;</button>' +
    '</div>';
  var prev = lb.querySelector(".lb-nav.prev");
  var next = lb.querySelector(".lb-nav.next");
  var close = lb.querySelector(".lb-close");
  if (prev) prev.onclick = function () { lbMove(-1); };
  if (next) next.onclick = function () { lbMove(1); };
  if (close) close.onclick = function () { closeLightbox(); };
  // 滑动切换
  var sx = 0, sy = 0, tracking = false;
  var stage = lb.querySelector(".lb-stage");
  if (stage) {
    stage.addEventListener("touchstart", function (e) {
      var t = e.changedTouches && e.changedTouches[0];
      if (!t) return;
      sx = t.clientX; sy = t.clientY; tracking = true;
    }, { passive: true });
    stage.addEventListener("touchend", function (e) {
      if (!tracking) return;
      tracking = false;
      var t = e.changedTouches && e.changedTouches[0];
      if (!t) return;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)) lbMove(dx < 0 ? 1 : -1);
    }, { passive: true });
  }
  lb.classList.add("show");
  lbRender();
}
function lbMove(delta) {

  LB_STATE.index = (LB_STATE.index + delta + n) % n;

/* ---------------- 数据操作 ---------------- */
/* 【修复·自动同步】AI/工具侧发帖后，前端要能自动看到。
   做法：定时拉一次 status，用「帖子指纹」判断内容是否真的变了，
   只有变了才重渲染 —— 避免每 3 秒无脑重绘（会打断滚动、闪屏）。 */
var feedFingerprint = "";
var feedPoller = null;

function fingerprintPosts(posts) {
  if (!Array.isArray(posts)) return "";
  var parts = [];
  for (var i = 0; i < posts.length; i++) {
    var p = posts[i];
    parts.push(p.id + "|" + (p.text || "").length + "|" +
      ((p.likedBy || []).length) + "," + ((p.retweetedBy || []).length) + "," + ((p.bookmarkedBy || []).length) + "|" +
      ((p.attachments || []).length) + "|" + (Number(p.commentCount) || 0) + "|" +
      (p.likeCount || 0) + "," + (p.retweetCount || 0) + "," + (p.bookmarkCount || 0));
  }
  return parts.join(";");
}

/* 【性能·聊天时暂停首页轮询】
   feedPoller 每 3 秒调一次 x_social:status，后端每次都要全量读 state.json（42KB）。
   停在聊天界面时这个轮询毫无意义（聊天不显示首页），却和聊天加载抢 IO，
   正是「打开聊天界面卡一下」的隐形帮凶之一。
   进入聊天时停掉，离开聊天再恢复。 */
function stopFeedPoller() {
  if (feedPoller) {
    try { clearInterval(feedPoller); } catch (e) { }
    feedPoller = null;
  }
}
/* 【性能·局部更新】首页轮询用的轻量版。
   light 模式后端不返回评论正文，这里把**已展开评论区**的那几条帖子
   的评论从内存里保留下来，避免轮询把正在看的评论清空。 */
function preserveOpenComments(nextPosts) {
  var open = S.openComments || {};
  var any = false;
  for (var i = 0; i < nextPosts.length; i++) {
    var p = nextPosts[i];
    if (!p || !open[p.id]) continue;
    var old = postById(p.id);
    if (old && Array.isArray(old.comments) && old.comments.length) {
      p.comments = old.comments;
      any = true;
    }
  }
  return any;
}

function startFeedPoller() {
  if (feedPoller) return;
  feedPoller = setInterval(function () {
    // 页面不可见时跳过，省电也避免后台无谓请求
    try { if (document.hidden) return; } catch (e) { }
    // 正在聊天视图时只更新数据，不打断聊天
    var wasView = S.view, wasTab = S.tab;
    XBridge.callTool("x_social:status", { limit: 100, light: true }).then(function (r) {
      if (!r || r.success === false) return;
      var d = (r.data || r) || {};
      var nextPosts = Array.isArray(d.posts) ? d.posts : [];
      preserveOpenComments(nextPosts);
      var fp = fingerprintPosts(nextPosts);
      // 账号资料变了（改名/换头像）也要同步
      var accChanged = false;
      if (Array.isArray(d.accounts)) {
        for (var i = 0; i < d.accounts.length; i++) {
          var a = d.accounts[i];
          var old = S.accounts[a.id];
          if (!old || old.displayName !== a.displayName || old.handle !== a.handle || old.avatarPath !== a.avatarPath) {
            accChanged = true; break;
          }
        }
      }
      if (fp === feedFingerprint && !accChanged) return;
      feedFingerprint = fp;
      S.posts = nextPosts;
      if (Array.isArray(d.accounts)) {
        S.accounts = {};
        d.accounts.forEach(function (a) { S.accounts[a.id] = a; });
      }
      updateMeAvatar();
      // 只在列表视图重绘，避免打断聊天/详情
      if (S.view === "list" && S.tab === "home") renderHome();
      else if (S.view === "profile") renderProfile(S.profileWho);
    });
  }, 3000);
}

    var d = (r && (r.data || r)) || {};
    S.posts = Array.isArray(d.posts) ? d.posts : [];
    feedFingerprint = fingerprintPosts(S.posts);
    if (Array.isArray(d.accounts)) {
