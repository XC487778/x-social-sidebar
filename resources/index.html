/* ---------------- 转推：原作者信息解析 ----------------
   【修复·转推卡片头部显示原作者】
   旧实现：转推副本的卡片头部直接沿用转推者自己的 name/handle/time，
   于是"张三的帖子被李四转推"却显示成"李四 @lisi · 34秒"。
   新实现：头部显示**原作者**（头像/昵称/handle/发布时间），
   转推者只保留在上一行"XX 转推了"里 —— 与 X 原版一致。
   原作者身份优先取实时账号表（改过昵称/用户名后立刻同步）。 */
function rtOriginInfo(p) {
  if (!p || !p.retweetOfPostId) return null;
  var origin = null;
  try { origin = pdFindPost(p.retweetOfPostId); } catch (e) { origin = null; }
  var originId = p.retweetOfAuthorId || (origin ? origin.authorId : "");
  var oacc = (originId && S.accounts) ? (S.accounts[originId] || {}) : {};
  var name = oacc.displayName || p.retweetOfAuthorDisplayName ||
             (origin ? (origin.authorDisplayName || "") : "") ||
             oacc.handle || p.retweetOfAuthorHandle || "未知作者";
  var handle = oacc.handle || p.retweetOfAuthorHandle ||
               (origin ? (origin.authorHandle || "") : "") ||
               (originId ? ("@" + originId) : "");
  var time = p.retweetOfCreatedAtMs || (origin ? origin.createdAtMs : 0);
  var atts = (Array.isArray(p.retweetOfAttachments) && p.retweetOfAttachments.length)
    ? p.retweetOfAttachments
    : (origin && Array.isArray(origin.attachments) ? origin.attachments : []);
  var text = p.retweetOfText || (origin ? (origin.text || "") : "");
  return { authorId: originId, name: name, handle: handle, time: time, text: text, attachments: atts };
}
/* ---------------- 渲染：帖子 ---------------- */
function postHTML(p) {
  var acc = S.accounts[p.authorId] || {};
  // 【修复·昵称同步】账号表（实时）优先于帖子里的快照，
  // 用户改了昵称/用户名后，所有旧帖立刻显示新名字。
  var name = acc.displayName || p.authorDisplayName || acc.handle || p.authorHandle || "Unknown";
  var handle = acc.handle || p.authorHandle || ("@" + (p.authorId || "user"));
  var liked = (p.likedBy || []).indexOf(S.me) >= 0;
  var reposted = (p.retweetedBy || []).indexOf(S.me) >= 0;
  var bookmarked = (p.bookmarkedBy || []).indexOf(S.me) >= 0;
  var atts = Array.isArray(p.attachments) ? p.attachments : [];
  var isMine = p.authorId === S.me;
  /* 【修复·转推卡片】转推副本自身无媒体，媒体挂在原帖上 */
  var rt = rtOriginInfo(p);
  if (rt && rt.attachments.length) atts = rt.attachments;

  var mediaHtml = "";
  if (atts.length) {
    /* 【修复·多图只显示 4 张】
       旧实现：atts.slice(0, 4) 硬编码截断，第 5 张及以后直接被丢弃，
       用户发 6 张图只能看到 4 张，且没有任何提示。
       新实现：全部渲染。X 的原生行为是：
         1 张 → 单列大图
         2 张 → 左右两列
         3 张 → 左列 1 张大图 + 右列 2 张（实际是 3 列网格首列跨 2 行）
         4 张 → 2×2
         5~9 张 → 3 列网格
       这里用 grid 实现，3 张时用「首图跨两行」还原 X 的版式。 */
    var n = atts.length;
    var cls = n === 1 ? "one" : (n === 2 ? "two" : (n === 3 ? "three" : (n === 4 ? "four" : "many")));
    var inner = "";
    atts.forEach(function (a, i) {
      var src = mediaUrl(a.path);
      if (a.type === "video") {
        /* 【修复·视频不显示封面】
           旧实现：<video> 没有 poster，WebView 里 preload="metadata"
           常常拿不到首帧 → 视频位置是一片黑。
           新实现：
             ① 用 <video poster="..."> 指向首帧图（后端若已生成则用）
             ② 没有 poster 时，用 CSS 渐变占位 + 播放徽标，至少不是纯黑
             ③ 加 #t=0.1 让浏览器跳到 0.1s，能拿到首帧当封面 */
        var poster = a.poster || a.thumbnail || a.cover || "";
        var posterAttr = poster ? ' poster="' + esc(mediaUrl(poster)) + '"' : "";
        inner += '<div class="media-video-wrap">' +
          '<video class="mi" src="' + esc(src) + '"' + posterAttr +
          ' preload="metadata" playsinline data-video="' + esc(src) + '#t=0.1" data-mp="' + esc(p.id) + '" data-mi="' + i + '"></video>' +
          '<div class="play-badge">' + SVG.play + '</div>' +
          (poster ? '' : '<div class="video-fallback"></div>') +
          '</div>';
      } else {
        inner += '<img class="mi" src="' + esc(src) + '" data-img="' + esc(src) + '" data-mp="' + esc(p.id) + '" data-mi="' + i + '" loading="lazy" />';
      }
    });
    mediaHtml = '<div class="post-media ' + cls + '">' + inner + '</div>';
  }

  var repostMark = "";
  var bodyText = p.text || "";
  /* 【修复·转推卡片】头部显示原作者；转推者只出现在"XX 转推了"一行 */
  var hName = name, hHandle = handle, hTime = p.createdAtMs, hAuthorId = p.authorId;
  if (rt) {
    repostMark = '<div class="repost-mark">' + SVG.repost + '<span>' + esc(name) + ' 转推了</span></div>';
    bodyText = rt.text;
    hName = rt.name; hHandle = rt.handle; hTime = rt.time; hAuthorId = rt.authorId;
  }

  var cCount = Array.isArray(p.comments) ? p.comments.length : (Number(p.commentCount) || 0);
  var cOpen = S.openComments && S.openComments[p.id];
  return '' +
    (repostMark ? repostMark : '') +
    '<article class="post" data-post="' + esc(p.id) + '" data-author="' + esc(p.authorId) + '">' +
      '<div class="avatar" style="' + avatarStyle(hAuthorId) + '" data-goto-author="' + esc(hAuthorId) + '">' +
        avatarInner(hAuthorId) +
      '</div>' +
      '<div class="post-body">' +
        '<div class="post-header">' +
          '<span class="post-name" data-goto-author="' + esc(hAuthorId) + '">' + esc(hName) + '</span>' +
          (hAuthorId === "ai" ? SVG.verified : "") +
          '<span class="post-handle">' + esc(hHandle) + '</span>' +
          '<span class="post-dot">·</span>' +
          '<span class="post-time">' + esc(relTime(hTime)) + '</span>' +
        '</div>' +
        (bodyText ? '<div class="post-text">' + esc(bodyText) + '</div>' : '') +
        mediaHtml +
        postActionsHTML(p) +
        commentsBoxHTML(p) +
      '</div>' +
    '</article>';
}

/* 【性能·局部更新】把操作栏单独抽出来。
   点赞/转发/收藏这类操作**不再整页重绘**（旧实现会 innerHTML 重建整个首页，
   导致十几张图片全部重新解码，体感就是"按一下卡一下"），
   而是用这个片段只替换那一条帖子的 .post-actions。 */
function postActionsHTML(p) {
  var liked = (p.likedBy || []).indexOf(S.me) >= 0;
  var reposted = (p.retweetedBy || []).indexOf(S.me) >= 0;
  var bookmarked = (p.bookmarkedBy || []).indexOf(S.me) >= 0;
  var cCount = Array.isArray(p.comments) ? p.comments.length : (Number(p.commentCount) || 0);
  var cOpen = S.openComments && S.openComments[p.id];
  var isMine = p.authorId === S.me;
  return '<div class="post-actions">' +
    '<button class="action-btn reply' + (cOpen ? ' active' : '') + '" data-act="comment" data-id="' + esc(p.id) + '">' + SVG.reply + '<span>' + (cCount ? fmtCount(cCount) : '评论') + '</span></button>' +
    '<button class="action-btn repost' + (reposted ? ' reposted' : '') + '" data-act="repost" data-id="' + esc(p.id) + '">' + SVG.repost + '<span>' + fmtCount(p.retweetCount) + '</span></button>' +
    '<button class="action-btn like' + (liked ? ' liked' : '') + '" data-act="like" data-id="' + esc(p.id) + '">' + (liked ? SVG.heartFilled : SVG.heart) + '<span>' + fmtCount(p.likeCount) + '</span></button>' +
    '<button class="action-btn' + (bookmarked ? ' bookmarked' : '') + '" data-act="bookmark" data-id="' + esc(p.id) + '">' + (bookmarked ? SVG.bookmarkFilled : SVG.bookmark) + '</button>' +
    (isMine ? '<button class="action-btn" data-act="delete" data-id="' + esc(p.id) + '">' + SVG.close + '</button>' : '') +
  '</div>';
}

/* 【性能·局部更新】只替换某一条帖子的操作栏，不动其它 DOM。
   返回 true 表示确实更新了。 */
function patchPostActions(p) {
  if (!p || !p.id) return false;
  var art = document.querySelector('article[data-post="' + cssAttrEsc(p.id) + '"]');
  if (!art) return false;
  var old = art.querySelector(".post-actions");
  if (!old) return false;
  var tmp = document.createElement("div");
  tmp.innerHTML = postActionsHTML(p);
  var neu = tmp.firstChild;
  if (!neu) return false;
  old.parentNode.replaceChild(neu, old);
  return true;
}

/* 【性能·局部更新】按 id 找帖子对象（用于原地改 likedBy 等字段） */
function postById(id) {
  if (!id) return null;
  var list = S.posts || [];
  for (var i = 0; i < list.length; i++) {
    if (list[i] && String(list[i].id) === String(id)) return list[i];
  }
  return null;
}

/* 属性选择器里用的转义（只处理引号与反斜杠） */
function cssAttrEsc(s) {
  return String(s == null ? "" : s).replace(/\\/g, "\\\\").replace(/"/g, '\\"');
}

/* ---------------- 渲染：主页（官方布局：无内嵌发帖框，发帖走右下角悬浮按钮） ---------------- */
function feedAccountBar() {
  var mine = S.accounts[S.me] || { displayName: "You", handle: "@you" };
  var other = S.accounts[S.me === "ai" ? "user" : "ai"] || {};
  var otherId = S.me === "ai" ? "user" : "ai";
  return '' +
    '<div class="feed-account-bar">' +
      '<button class="pill-account" data-goto-author="' + esc(S.me) + '">' +
        '<span class="avatar" style="' + avatarStyle(S.me) + '">' + avatarInner(S.me) + '</span>' +
        '<span>' + esc(mine.displayName || "You") + '</span>' +
      '</button>' +
      '<span>当前浏览</span>' +
      '<button class="pill-account" data-goto-author="' + esc(otherId) + '">' +
        '<span class="avatar" style="' + avatarStyle(otherId) + '">' + avatarInner(otherId) + '</span>' +
        '<span>查看 ' + esc(other.displayName || otherId) + '</span>' +
      '</button>' +
    '</div>';
}

function renderHome() {
  S.view = "list";
  elTopTitle.textContent = "主页";
  elScroll.classList.remove("chat-mode");
  var html = feedAccountBar() +
    '<div id="feedList">' +
      (S.posts.length ? S.posts.map(postHTML).join('') : '<div class="empty"><div class="big">🕊️</div>还没有帖子<br/>点右下角按钮发一条</div>') +
    '</div>';

  elScroll.innerHTML = html;
}

/* ---------------- 全屏发帖编辑器（官方右下角蓝圈白加号入口） ---------------- */
function openComposer() {
  var mask = document.getElementById("modalMask");
  var body = document.getElementById("sheetBody");
  if (!mask || !body) return;
  S.pendingMedia = [];
  body.innerHTML = '' +
    '<div class="compose-head">' +
      '<button class="cancel" id="composeCancel">取消</button>' +
      '<div class="grow"></div>' +
      '<button class="post-btn" id="composePost" disabled>发帖</button>' +
    '</div>' +
    '<div class="compose-body">' +
      '<div class="row">' +
        '<div class="avatar sm" style="' + avatarStyle(S.me) + '">' + avatarInner(S.me) + '</div>' +
        '<textarea id="composerInput" rows="3" placeholder="有什么新鲜事？" maxlength="280"></textarea>' +
      '</div>' +
      '<div id="mediaPreview" class="compose-media"></div>' +
      '<div class="compose-tools">' +
        '<button class="tool-btn" data-pick="image" aria-label="图片">' + SVG.image + '</button>' +
        '<button class="tool-btn" data-pick="video" aria-label="视频">' + SVG.video + '</button>' +
      '</div>' +
    '</div>';
  mask.classList.add("show");
  mask.classList.add("compose");
  renderMediaPreview();
  bindComposer();
  var input = document.getElementById("composerInput");
  if (input) setTimeout(function () { try { input.focus(); } catch (e) { } }, 80);
}

function closeComposer() {
  var mask = document.getElementById("modalMask");
  var body = document.getElementById("sheetBody");
  if (mask) { mask.classList.remove("show"); mask.classList.remove("compose"); }
  if (body) body.innerHTML = "";
  S.pendingMedia = [];
}

/* ---------------- 渲染：通知 ---------------- */
/* 参考图布局：顶部分段 Tab（All / Mentions / Verified），
   每行 = 左侧操作者圆头像 + 右侧「XX 赞了你的帖子 · 3d」+ 原文预览 */
function ntfActorId(n) {
  return String((n && (n.actorId || n.actor)) || "");
}
function ntfAvatarHTML(n) {
  var id = ntfActorId(n);
  var acc = S.accounts[id] || {};
  var ini = esc(iniFor(acc.displayName || n.actorDisplayName, acc.handle || n.actorHandle));
  var bg = esc(gradFor(id || "user"));
  if (acc.avatarPath) {
    return '<div class="ntf-avatar"><img src="' + esc(mediaUrl(acc.avatarPath)) + '" alt="" /></div>';
  }
  return '<div class="ntf-avatar" style="background:' + bg + '">' + ini + '</div>';
}
function ntfTextHTML(n) {
  var who = esc(n.actorDisplayName || n.actorHandle || "");
  var t = String(n.type || "");
  var body = "";
  if (t === "like") body = " 赞了你的帖子";
  else if (t === "repost") body = " 转发了你的帖子";
  else if (t === "follow") body = " 关注了你";
  else if (t === "comment") body = " 评论了你的帖子";
  else if (t === "mention") body = " 提及了你";
  else if (t === "dm") body = " 给你发了私信";
  else body = " " + esc(n.text || "提及了你");
  var line = '<div class="ntf-line"><b>' + who + '</b>' + body + '</div>';
  // 点赞/评论类显示被互动帖子的原文，私信类不重复显示（已经是消息内容）
  var showText = n.text && (t === "like" || t === "repost" || t === "comment" || t === "mention");
  if (showText) {
    line += '<div class="ntf-line" style="color:var(--text-secondary);margin-top:2px;">' + esc(n.text) + '</div>';
  }
  return line;
}
function renderNotifications() {
  S.view = "list";
  elTopTitle.textContent = "通知";
  var tab = S.ntfTab || "all";
  var all = S.notifications || [];
  var list = all;
  if (tab === "mentions") {
    list = all.filter(function (n) { return n.type === "mention" || n.type === "comment"; });
  } else if (tab === "verified") {
    // Verified：只显示来自「已认证」账号（AI 账号带认证标）的通知
    list = all.filter(function (n) {
      var id = ntfActorId(n);
      return id === "ai";
    });
  }
  var rows = list.map(function (n) {
    var icon = n.type === "like" ? SVG.heart : (n.type === "repost" ? SVG.repost : (n.type === "follow" ? SVG.follow : (n.type === "comment" ? SVG.reply : SVG.dm)));
    var color = n.type === "like" ? "#f91880" : (n.type === "repost" ? "#00ba7c" : (n.type === "follow" ? "#1d9bf0" : "#7856ff"));
    return '' +
      '<div class="ntf-row">' +
        '<div class="ntf-icon" style="color:' + color + '">' + icon + '</div>' +
        ntfAvatarHTML(n) +
        '<div class="ntf-main">' +
          ntfTextHTML(n) +
          '<div class="ntf-time">' + esc(relTime(n.createdAtMs)) + '</div>' +
        '</div>' +
      '</div>';
  }).join('');

  var tabs = '' +
    '<div class="ntf-tabs">' +
      '<button class="ntf-tab' + (tab === "all" ? " active" : "") + '" data-ntf-tab="all">全部</button>' +
      '<button class="ntf-tab' + (tab === "mentions" ? " active" : "") + '" data-ntf-tab="mentions">提及</button>' +
      '<button class="ntf-tab' + (tab === "verified" ? " active" : "") + '" data-ntf-tab="verified">已认证</button>' +
    '</div>';

  elScroll.innerHTML = tabs + (rows
    ? rows
    : '<div class="empty"><div class="big">🔔</div>还没有通知<br/>有人互动时会出现在这里</div>');

  Array.prototype.forEach.call(document.querySelectorAll("[data-ntf-tab]"), function (b) {
    b.addEventListener("click", function () {
      S.ntfTab = b.getAttribute("data-ntf-tab");
      renderNotifications();
    });
  });
}

/* ---------------- 渲染：私信列表 ---------------- */
function renderMessages() {
  S.view = "list";
  elTopTitle.textContent = "Chat";
  // 原版 X 的顶栏：右侧是「All ⌄」筛选按钮
  setDmFilterVisible(true);

  var all = S.threads || [];
  var q = String(S.dmQuery || "").trim().toLowerCase();
  var list = all;
  // 顶栏筛选：All / Unread
  if (S.dmFilter === "unread") {
    list = list.filter(function (t) { return (Number(t.unread) || 0) > 0; });
  }
  if (q) {
    list = list.filter(function (t) {
      var acc = t.peerAccount || {};
      var hay = [(acc.displayName || ""), (acc.handle || ""), (t.peer || "")].join(" ").toLowerCase();
      return hay.indexOf(q) >= 0;
    });
  }

  var rows = list.map(function (t) {
    var acc = t.peerAccount || {};
    var name = acc.displayName || acc.handle || t.peer;
    var last = t.lastMessage || {};
    var preview = last.text || (last.attachments && last.attachments.length ? "[媒体]" : "");
    var unread = Number(t.unread) || 0;
    return '' +
      '<div class="dm-row" data-chat="' + esc(t.peer) + '">' +
        '<div class="avatar" style="' + avatarStyle(t.peer) + '">' + avatarInner(t.peer) + '</div>' +
        '<div class="dm-main">' +
          '<div class="dm-top">' +
            '<span class="dm-name">' + esc(name) + '</span>' +
            (t.peer === "ai" ? SVG.verified : "") +
            '<span class="dm-time">' + esc(relTime(last.createdAtMs || t.updatedAtMs)) + '</span>' +
          '</div>' +
          '<div class="dm-preview' + (unread ? ' unread' : '') + '">' + esc(preview) + '</div>' +
        '</div>' +
        (unread ? '<span class="dm-unread-dot"></span>' : '') +
      '</div>';
  }).join('');

  // 原版 X：圆角搜索框
  var searchBar = '<div class="dm-search">' + SVG.search +
    '<input id="dmSearchInput" placeholder="Search" value="' + esc(S.dmQuery || "") + '" />' +
    '</div>';

  // 绑定对话卡片（保留原功能）
  var boundChat = (S.chatLinks && S.chatLinks["ai"]) || "";
  var bindCard = '<div class="dm-bind-card">' +
    '<span class="dot' + (boundChat ? " on" : "") + '"></span>' +
    '<span class="bind-label">' + (boundChat ? "AI 私信已接到 Operit 对话" : "AI 私信当前为本机模拟") + '</span>' +
    '<select id="bindChatSelect"><option value="">未绑定（本机模拟）</option>' +
      (S.chatOptions || []).map(function (c) {
        // 【需求】统一显示「聊天标题(角色卡)」，与聊天页标题保持一致。
        // 原来这里只取 characterCardName || title，两种信息互斥、只显示一个。
        return '<option value="' + esc(c.id) + '"' + (c.id === boundChat ? " selected" : "") + '>' +
          esc(chatOptionLabel(c)) + (c.isCurrent ? "（当前）" : '') + '</option>';
      }).join("") +
    '</select>' +
    '<button class="pill-mini" id="bindChatRefresh">刷新</button>' +
  '</div>';

  elScroll.innerHTML =
    searchBar +
    bindCard +
    (rows || '<div class="empty"><div class="big">💬</div>' +
      (q ? '没有匹配「' + esc(S.dmQuery) + '」的会话' : '还没有私信<br/>输入 ai 或 user 开始聊天') + '</div>');

  var sel = document.getElementById("bindChatSelect");
  if (sel) {
    sel.addEventListener("change", function () {
      var cid = String(sel.value || "");
      XBridge.callTool("x_social:bindChat", { peer: "ai", chatId: cid }).then(function (r) {
        if (r && r.success === false) { showToast(r.message || "绑定失败"); return; }
        S.chatLinks = S.chatLinks || {};
        if (cid) S.chatLinks["ai"] = cid; else delete S.chatLinks["ai"];
        showToast(cid ? "已绑定对话" : "已解除绑定");
        renderMessages();
      });
    });
  }
  var refreshBind = document.getElementById("bindChatRefresh");
  if (refreshBind) {
    refreshBind.addEventListener("click", function () { loadChatOptions(true); });
  }
  var searchInput = document.getElementById("dmSearchInput");
  if (searchInput) {
    searchInput.addEventListener("input", function () {
      S.dmQuery = String(searchInput.value || "");
      // 只重绘列表部分，保留输入焦点
      var pos = searchInput.selectionStart;
      renderMessages();
      var again = document.getElementById("dmSearchInput");
      if (again) {
        again.focus();
        try { again.setSelectionRange(pos, pos); } catch (e) { }
      }
    });
    // 输入 user / ai 直接回车开聊（原版 X 的搜索行为）
    searchInput.addEventListener("keydown", function (e) {
      if (e.key !== "Enter") return;
      e.preventDefault();
      var v = String(searchInput.value || "").trim().toLowerCase().replace(/^@/, "");
      if (v === "user" || v === "ai") {
        S.dmQuery = "";
        openChat(v);
      } else {
        showToast("输入 user 或 ai 可以直接开聊");
      }
    });
  }
}
/* 读取 Operit 对话列表用于绑定 */
function loadChatOptions(force) {
  if (!force && S.chatOptionsReady) return;
  XBridge.callTool("x_social:listChats", {}).then(function (r) {
    /* 【修复·绑定下拉框空白】listChats 失败/超时时**保留**已有选项，
       不要用空数组覆盖 —— 否则一次抖动就把下拉框清成只剩「未绑定」，
       用户看着像绑定丢了，其实后台绑定一直都在。 */
    if (r && r.success === false) {
      S.chatOptionsReady = !!S.chatOptions.length;
      return;
    }
    var d = (r && (r.data || r)) || {};
    var chats = Array.isArray(d.chats) ? d.chats : null;
    /* 返回 chats 缺失/非数组（宿主异常）时同样不清空 */
    if (!chats) {
      S.chatOptionsReady = !!S.chatOptions.length;
      return;
    }
    S.chatOptions = chats;
    S.chatOptionsReady = true;
    if (S.view === "list" && S.tab === "messages") renderMessages();
  }).catch(function () {
    S.chatOptionsReady = !!S.chatOptions.length;
  });
  XBridge.callTool("x_social:chatLinks", {}).then(function (r) {
    var d = (r && (r.data || r)) || {};
    S.chatLinks = d.links || {};
    S.chatLinkMeta = d.meta || {};
    if (S.view === "list" && S.tab === "messages") renderMessages();
    else if (S.view === "chat") renderChat(S.chatPeer, S.chatMessages || []);
    /* 【v20】绑定信息到位后，如果正停在 AI 聊天页，立刻补同步一次
       对话里已生成的 AI 回复（只读，不发消息）。 */
    if (S.view === "chat" && S.chatPeer === "ai") {
      var b2 = (S.chatLinks && S.chatLinks["ai"]) || "";
      /* 【修复】带上当前竞态令牌，避免旧回调把数据写进已切换的会话 */
      if (b2) syncAiRepliesFromChat("ai", b2, S.chatToken);
    }
  });
}

/* ---------------- 渲染：私信会话 ---------------- */
/* 清理对话原文里的思考过程/工具调用等内部标签，取出可读正文 */
function cleanChatText(raw) {
  var t = String(raw == null ? "" : raw);
  t = t.replace(/<think>[\s\S]*?<\/think>/gi, "");
  t = t.replace(/<think[\s\S]*$/gi, "");
  t = t.replace(/<tool>[\s\S]*?<\/tool>/gi, "");
  t = t.replace(/<tool[\s\S]*$/gi, "");
  t = t.replace(/<attachment[^>]*>[\s\S]*?<\/attachment>/gi, "");
  t = t.replace(/\n{3,}/g, "\n\n").trim();
  return t;
}
/* 桥接回复轮询（v20）：改走 UI 帧直连对话。
   旧版用后端 bridgeSend/bridgePoll（包运行时），绑定对话=当前会话时会撞上
   宿主 busy 保护（"Previous message is still being processed"），消息根本没进
   对话，AI 永远不回复。v20 改成：
     ① UI 帧 chatSend   → 消息进入绑定对话
     ② UI 帧 chatHistory → 读回 AI 的新回复
     ③ 后端 aiReply      → 把回复落库到 X 私信
   指纹用「最后一条助手消息的正文」做基准，只认发送之后新出现的回复。 */
var chatPollTimer = null;
function stopChatPoll() {
  try { if (chatPollTimer) clearInterval(chatPollTimer); } catch (e) { }
  chatPollTimer = null;
}
/* 从 UI 帧读回的历史里，取出「基准时间之后」最新的 AI 回复。
 *  【修复】旧实现用「正文前 200 字符」当指纹来判断新旧，
 *  但 AI 回复可能以相同开头（如都以「收到」起头），
 *  导致新回复被误判成旧回复 → 收不到回复。
 *  改用**时间戳**做基准，只要比基准晚产生的就是新回复。
 *  【修复·对话记录混乱】同时把该回复的真实时间戳一起带出去，
 *  让后端落库时用真实时间 → 气泡顺序 = 真实对话顺序。 */
function pickFreshAiReply(history, beforeTs) {
    var msgs = Array.isArray(history) ? history : [];
    var fresh = null;
    var freshTs = 0;
    for (var i = msgs.length - 1; i >= 0; i--) {
      var m = msgs[i] || {};
      var sender = String(m.sender || "");
      if (sender !== "ai" && sender !== "assistant" && sender !== "bot") continue;
      var ts = Number(m.timestamp || 0);
      // beforeTs 之前的都是旧回复，跳过
      if (beforeTs > 0 && ts > 0 && ts <= beforeTs) continue;
      var text = cleanChatText(m.content);
      if (!text) continue;
      if (fresh && ts && freshTs && ts <= freshTs) continue;
      fresh = text;
      freshTs = ts;
    }
    // 同时返回时间戳（供落库排序用）
    return { text: fresh, ts: freshTs };
  }
/* ================================================================
   【新增·社交事件桥接】发帖 / 评论 → 绑定对话 → AI 回复回填评论区
   ----------------------------------------------------------------
   用户需求：用户发帖子、给 AI 评论（含 AI 在评论区的评论），
   都要通过桥接发给绑定聊天的对话。

   分工（重要）：
     后端 x_social:post / comment 落库后**只负责把事件送进对话**，
       不发长轮询（工具返回后包运行时会回收，轮询必断）。
     回复的读取与回填由这里（UI 帧）驱动：
       ① chatHistory 取「发送前最后一条 AI 回复的时间戳」当基准
       ② chatSend 把事件消息送进绑定对话
       ③ 轮询 chatHistory，出现比基准新的 AI 回复 → aiReplyComment 落库
   这条链路与私信桥接（pollBridgeReply）同构，已被验证可用。
   ================================================================ */
var socialPollTimer = null;
function stopSocialPoll() {
  try { if (socialPollTimer) clearTimeout(socialPollTimer); } catch (e) { }
  socialPollTimer = null;
}

/* 把帖子附件里的图片拼成 markdown 图片链接（宿主解析后 AI 能直接看到照片） */
function attachmentImageMarkdown(post, limit) {
  var max = typeof limit === "number" ? limit : 4;
  var atts = (post && post.attachments) || [];
  var lines = [];
  var n = 0;
  for (var i = 0; i < atts.length && n < max; i++) {
    var a = atts[i] || {};
    if (a.type !== "image") continue;
    var p = String(a.path || "");
    if (!p) continue;
    var uri = (p.indexOf("://") >= 0) ? p : ("file://" + p);
    lines.push("图片" + (n + 1) + "：![帖子图片" + (n + 1) + "](" + uri + ")");
    n++;
  }
  return lines;
}

/* 生成发往对话的事件文案（与后端 formatSocialEvent 保持一致的语义） */
function buildSocialEventText(kind, post, comment) {
  var lines = [];
  var pText = (post && post.text) || "";
  var pAuthor = (post && (post.authorDisplayName || post.authorHandle)) || "";
  if (kind === "post") {
    lines.push("【X 平台 · 新帖子】");
    lines.push("发帖人：" + pAuthor + (post.authorHandle ? "（" + post.authorHandle + "）" : ""));
    lines.push("帖子内容：" + (pText || "（无正文）"));
    var atts = (post && post.attachments) || [];
    if (atts.length) {
      lines.push("附带媒体：" + atts.length + " 个（" +
        atts.map(function (a) { return a.type === "video" ? "视频" : "图片"; }).join("、") + "）");
    }
    /* 【图片通道】宿主用特殊的 link 标签（type=image）承载多模态图片，
       标签由 describePostImages 工具注册后追加在文案末尾。 */
    lines.push("帖子ID：" + post.id);
    lines.push("如果你想回应这条帖子，请调用 x_social:comment 工具来发布评论");
    lines.push("（postId=" + post.id + "，author=\"ai\"，text=你的评论正文）。");
    lines.push("只发布你真正想说的话；如果你认为无需回应，可以不调用该工具。");
  } else if (kind === "user_comment") {
    lines.push("【X 平台 · 用户评论】");
    lines.push("评论人：" + ((comment && (comment.authorDisplayName || comment.authorHandle)) || "用户"));
    lines.push("评论内容：" + ((comment && comment.text) || ""));
    lines.push("所在帖子（作者 " + pAuthor + "）：" + pText.slice(0, 200));
    lines.push("帖子ID：" + post.id);
    lines.push("如果你想回应这条评论，请调用 x_social:comment 工具来发布评论");
    lines.push("（postId=" + post.id + "，author=\"ai\"，text=你的评论正文）。");
    lines.push("只发布你真正想说的话；如果你认为无需回应，可以不调用该工具。");
  } else {
    lines.push("【X 平台 · AI 评论】");
    lines.push("评论者：" + ((comment && (comment.authorDisplayName || comment.authorHandle)) || ""));
    lines.push("评论内容：" + ((comment && comment.text) || ""));
    lines.push("所在帖子（作者 " + pAuthor + "）：" + pText.slice(0, 200));
    lines.push("帖子ID：" + post.id);
    lines.push("这条评论来自 AI 自己（可能是你之前在别处的回复），此处仅作记录。");
    lines.push("**不需要**对此再回复 —— 回复自己的话没有意义，还可能造成循环。");
  }
  return lines.join("\n");
}

/* 主流程：把社交事件送进绑定对话。
   【重要·设计修正】只投递事件，**不自动回填** AI 的回复。
     AI 自己决定要不要回、回什么 → 用 x_social:comment 工具发布 → 前端只负责刷新显示。
   opts.queueItem: 若来自后端队列（AI 通过工具调用发的帖子/评论），
                 带上它以便投递成功后 socialBridgeAck 清队列 + 打「待回复窗口」。
   返回 Promise，resolve 时表示「事件已送出」。 */
function bridgeSocialEvent(kind, post, comment, opts) {
  opts = opts || {};
  if (!post || !post.id) return Promise.resolve({ ok: false, reason: "no post" });
  var links = S.chatLinks || {};
  var chatId = String(links["ai"] || "");
  if (!chatId) {
    /* 没绑定对话 → 静默跳过，不影响发帖/评论本身 */
    /* 【修复·可见反馈】原来这里直接 return，事件被静默丢弃，
       用户只看到「AI 收不到」，完全不知道是没绑定还是发送失败。
       现在弹一个提示，让人一眼看出问题出在哪。 */
    showToast("未绑定对话，事件未送达 AI（请在「消息」页绑定）");
    return Promise.resolve({ ok: false, reason: "未绑定对话" });
  }
  var text = buildSocialEventText(kind, post, comment);
  /* 【带图发帖】把图片行追加到文案末尾。
     describePostImages 现在返回的是宿主多模态图片标签（照片本体），
     注册失败时它会自动降级为文字描述，这里两种都能直接拼。 */
  var imgLines = (opts && opts.imageLines) || (opts && opts.imageDescLines) || [];
  if (imgLines.length) {
    text = text + "\n" + imgLines.join("\n");
  }
  return XBridge.chatHistory(chatId, 6).then(function (hr) {
    var beforeTs = 0;
    try {
      var hd = (hr && hr.data) || {};
      var hmsgs = Array.isArray(hd.messages) ? hd.messages : [];
      for (var i = hmsgs.length - 1; i >= 0; i--) {
        var hm = hmsgs[i] || {};
        var hs = String(hm.sender || "");
        if (hs !== "ai" && hs !== "assistant" && hs !== "bot") continue;
        beforeTs = Number(hm.timestamp || 0);
        break;
      }
    } catch (e) { }
    return XBridge.chatSend(chatId, text).then(function (sr) {
      if (sr && sr.success === false) {
        /* 【修复·可见反馈】发送失败原来也是静默的，只体现在「AI 没回话」上。 */
        showToast("事件发送失败：" + (sr.message || "未知原因"));
        return { ok: false, reason: sr.message || "发送失败" };
      }
      /* 投递成功 → 清队列 + 给该帖打「待回复窗口」，
         这样 AI 接下来针对这条帖发出的评论不会再触发新一轮桥接。 */
      if (opts.queueItem && opts.queueItem.id) {
        XBridge.callTool("x_social:socialBridgeAck", {
          ids: [String(opts.queueItem.id)],
          postIds: [String(post.id)]
        }).catch(function () { });
      }
      pollSocialReply(chatId, post.id, beforeTs);
      return { ok: true, chatId: chatId, beforeTs: beforeTs };
    });
  }).catch(function (e) {
    return { ok: false, reason: String((e && e.message) || e) };
  });
}

/* 轮询评论区，等 AI **自己用 x_social:comment 工具**发出评论后刷新 UI。
   【重要·设计修正】旧版会把 AI 在对话里的整条回复自动回填成评论，
   结果把 AI 的工作稿（推理文字、<link> 标签等）也灌进了评论区。
   现在改成：桥接只投递事件 → AI 自己决定要不要回、回什么 →
   通过 x_social:comment 工具落库 → 这里只负责把新评论显示出来。 */
function pollSocialReply(chatId, postId, beforeTs) {
  stopSocialPoll();
  var tries = 0;
  var MAX_TRIES = 90;           // 90 × 2s ≈ 3 分钟
  var lastSig = "";
  function tick() {
    tries++;
    if (tries > MAX_TRIES) { stopSocialPoll(); return; }
    XBridge.callTool("x_social:listComments", { postId: postId }).then(function (lr) {
      if (!lr || lr.success === false) { schedule(); return; }
      var ld = (lr && (lr.data || lr)) || {};
      var list = Array.isArray(ld.comments) ? ld.comments : [];
      // 用「评论条数 + 最后一条的 id」当签名，有变化才重绘
      var last = list.length ? (list[list.length - 1] || {}) : {};
      var sig = list.length + ":" + (last.id || "");
      if (sig !== lastSig) {
        lastSig = sig;
        // 首页：更新该帖的评论数与评论列表
        for (var i = 0; i < S.posts.length; i++) {
          if (S.posts[i].id === postId) {
            S.posts[i].comments = list;
            S.posts[i].commentCount = list.length;
            break;
          }
        }
        renderHome();
        // 详情页：同步刷新回复时间线
        if (typeof PD !== "undefined" && PD.postId && String(PD.postId) === String(postId)) {
          PD.comments = list;
          if (PD.post) { PD.post.comments = list; PD.post.commentCount = list.length; }
          PD.loading = false;
          pdRender();
        }
      }
      schedule();
    }).catch(function () { schedule(); });
  }
  function schedule() {
    if (tries >= MAX_TRIES) return;
    try { socialPollTimer = setTimeout(tick, 2000); } catch (e) { }
  }
  schedule();
}

/* ================================================================
   【社交事件桥接·队列泵】AI 侧事件的投递
   ----------------------------------------------------------------
   ⚠ 重要：AI 自己发的帖子/评论**不再入队**（后端已改），
      所以这个队列里理论上只有「用户侧事件」的备份。
      这里再做一道前端防线：万一有历史残留的 ai_post / ai_comment，
      一律跳过 —— AI 收到自己的回声是纯噪音 + 回环源。
   ================================================================ */
var socialQueueTimer = null;
var socialQueueBusy = false;
function stopSocialQueuePump() {
  try { if (socialQueueTimer) clearTimeout(socialQueueTimer); } catch (e) { }
  socialQueueTimer = null;
}
function pumpSocialQueue() {
  stopSocialQueuePump();
  if (socialQueueBusy) return;
  var chatId = String((S.chatLinks || {})["ai"] || "");
  if (!chatId) { schedulePump(); return; }
  socialQueueBusy = true;
  XBridge.callTool("x_social:socialBridgeQueue", { limit: 10 }).then(function (qr) {
    if (!qr || qr.success === false) { socialQueueBusy = false; schedulePump(); return; }
    var qd = (qr && (qr.data || qr)) || {};
    var items = Array.isArray(qd.items) ? qd.items : [];
    if (!items.length) { socialQueueBusy = false; schedulePump(); return; }
    // 逐条投递（串行，避免宿主 busy）
    var idx = 0;
    function next() {
      if (idx >= items.length) { socialQueueBusy = false; schedulePump(); return; }
      var it = items[idx++];
      var kind = String(it.kind || "");
      var postId = String(it.postId || "");
      var commentId = String(it.commentId || "");
      if (!postId) { next(); return; }
      /* 【防回环·前端第二道防线】AI 自己发的事件一律不投递，
         直接 ack 清掉（AI 收到自己的回声没有新信息，还会引发回环）。 */
      if (kind === "ai_post" || kind === "ai_comment") {
        XBridge.callTool("x_social:socialBridgeAck", {
          ids: [String(it.id)]
        }).catch(function () { });
        next();
        return;
      }
      // 取该帖 + （评论事件的）评论内容
      XBridge.callTool("x_social:listComments", { postId: postId }).then(function (lr) {
        var ld = (lr && (lr.data || lr)) || {};
        var clist = Array.isArray(ld.comments) ? ld.comments : [];
        var cmt = null;
        if (commentId) {
          for (var i = 0; i < clist.length; i++) {
            if (String(clist[i].id) === commentId) { cmt = clist[i]; break; }
          }
        }
        var post = { id: postId, text: "", comments: clist };
        // 用已有的帖子数据补全作者/正文
        for (var j = 0; j < (S.posts || []).length; j++) {
          if (String(S.posts[j].id) === postId) { post = S.posts[j]; break; }
        }
        var kind2 = (kind === "ai_post" || kind === "ai_comment") ? null : kind;
        if (!kind2) { next(); return; }
        bridgeSocialEvent(kind2, post, cmt, { queueItem: it }).then(function (res) {
          if (!res || !res.ok) {
            // 投递失败（如宿主忙）→ 不 ack，下一轮再试
            socialQueueBusy = false;
            schedulePump();
            return;
          }
          next();
        });
      }).catch(function () { next(); });
    }
    next();
  }).catch(function () { socialQueueBusy = false; schedulePump(); });
}
function schedulePump() {
  stopSocialQueuePump();
  try { socialQueueTimer = setTimeout(pumpSocialQueue, 5000); } catch (e) { }
}
/* 页面加载后启动队列泵 */
function startSocialQueuePump() {
  stopSocialQueuePump();
  try { socialQueueTimer = setTimeout(pumpSocialQueue, 3000); } catch (e) { }
}

function pollBridgeReply(peer, baselineCount, chatId, before) {
  stopChatPoll();
  var tries = 0;
  /* 【修复·竞态】记录发起时的会话令牌；用户切走又切回同一会话时，
     旧轮询若还在跑会把「上一次会话」的回复写进当前会话 → 记录混乱。 */
  var pollToken = S.chatToken;
  chatPollTimer = setInterval(function () {
    tries++;
    if (pollToken !== S.chatToken) { stopChatPoll(); return; }
    if (S.view !== "chat" || S.chatPeer !== peer || tries > 120) { stopChatPoll(); return; }
    XBridge.chatHistory(chatId, 20).then(function (r) {
      if (!r || r.success === false) return;
      var d = r.data || {};
      var hist = (d && d.messages) ? d.messages : [];
      var picked = pickFreshAiReply(hist, before);
      if (!picked || !picked.text) return;
      stopChatPoll();
      // 落库到 X 私信（后端带去重 + 时间游标，重复调用不会重复写）
      XBridge.callTool("x_social:aiReply", {
        text: picked.text, peer: peer, actor: S.me,
        sinceTs: before,
        // 【修复·对话记录混乱】带上对话里的真实时间戳
        sourceTs: picked.ts,
        dedupe: "aichat:" + String(chatId) + ":" + picked.ts + ":" + picked.text.slice(0, 60)
      }).then(function () {
        return XBridge.callTool("x_social:dmMessages", { actor: S.me, peer: peer, limit: 200 });
      }).then(function (rr) {
        var dd = (rr && (rr.data || rr)) || {};
        if (S.view === "chat" && S.chatPeer === peer) {
          renderChat(peer, Array.isArray(dd.messages) ? dd.messages : []);
        }
      });
    });
  }, 2500);
}
/* 本机账号之间的私信：短轮询兜底，保证另一端消息也能出现 */
function pollChatReply(peer, baselineCount) {
  stopChatPoll();
  var tries = 0;
  var pollToken = S.chatToken;   /* 【修复·竞态】同 pollBridgeReply */
  chatPollTimer = setInterval(function () {
    tries++;
    if (pollToken !== S.chatToken) { stopChatPoll(); return; }
    if (S.view !== "chat" || S.chatPeer !== peer || tries > 20) { stopChatPoll(); return; }
    XBridge.callTool("x_social:dmMessages", { actor: S.me, peer: peer, limit: 200 }).then(function (r) {
      var d = (r && (r.data || r)) || {};
      var msgs = Array.isArray(d.messages) ? d.messages : [];
      if (msgs.length > baselineCount && S.view === "chat" && S.chatPeer === peer) {
        stopChatPoll();
        renderChat(peer, msgs);
      }
    });
  }, 2500);
}
/* 把「对话标题 + 角色卡名」拼成统一的展示名。
   例：早安问候(角色卡名)
   规则：
     - 标题是图片文件名（1000049019.jpg）→ 视为无标题，只用角色卡名
     - 标题与角色卡名相同 → 不重复拼接
     - 只有一个 → 直接用那个
   chatTitleFor(聊天页标题) 和 chatOptionLabel(绑定下拉框) 共用本函数，
   保证两处显示完全一致。 */
function composeChatLabel(title, cardName) {
  var t = String(title || "").trim();
  var c = String(cardName || "").trim();
  if (t && /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(t)) t = "";
  if (t && c && t !== c) return t + "(" + c + ")";
  if (t) return t;
  if (c) return c;
  return "";
}

/* 绑定下拉框里每一项的显示名 */
function chatOptionLabel(c) {
  if (!c) return "";
  var label = composeChatLabel(c.title, c.characterCardName);
  if (label) return label;
  return String(c.id || "");
}

function chatTitleFor(peer) {
  // 【需求】聊天标题显示「聊天标题(角色卡)」
  //   例：早安问候(角色卡名)
  // 取绑定对话的对话标题 + 角色卡名；没绑定就退回 X 账号名。
  var acc = S.accounts[peer] || {};
  var fallback = acc.displayName || acc.handle || peer;
  var boundChatId = "";
  if (peer === "ai") boundChatId = (S.chatLinks && S.chatLinks["ai"]) || "";
  else if (peer === "user") boundChatId = (S.chatLinks && S.chatLinks["user"]) || "";
  if (!boundChatId) return fallback;
  var meta = (S.chatLinkMeta && S.chatLinkMeta[boundChatId]) || null;
  // 没有 meta 时退回从 chatOptions 里找
  if (!meta) {
    var opt = null;
    var opts = S.chatOptions || [];
    for (var i = 0; i < opts.length; i++) {
      if (String(opts[i].id) === String(boundChatId)) { opt = opts[i]; break; }
    }
    if (opt) {
      meta = {
        title: String(opt.title || ""),
        characterCardName: String(opt.characterCardName || ""),
        displayName: String(opt.characterCardName || opt.title || ""),
      };
    }
  }
  if (!meta) return fallback;
  var label = composeChatLabel(meta.title, meta.characterCardName);
  return label || fallback;
}

/* 合并两份消息列表（本地乐观气泡 + 服务端快照），按 id 去重。
   *  【修复·用户消息不显示 / 消息重复】
   *  - 服务端快照到达时会整批覆盖本地列表，导致「刚发出但快照里还没有」
   *    的用户消息消失。
   *  - 但本地乐观气泡没有真实 id，直接按 id 合并会和服务器那条重复成两条。
   *
   *  方案：
   *   ① 有 id 的消息按 id 去重（服务端版本更完整，覆盖本地）
   *   ② 没 id 的本地气泡，按「发送方 + 正文 + 时间接近(±2s)」去匹配服务端同一条
   *   ③ 匹配不上的本地气泡保留（说明服务端确实还没有）
   */
function chatMsgKey(m) {
    if (!m) return "";
    var id = String(m.id || "");
    if (id) return id;
    var ts = Number(m.createdAtMs || 0);
    return "__local__" + String(m.from || "") + "|" + String(m.text || "").slice(0, 80) + "|" + ts;
  }
/* 【修复·消息顺序错乱】稳定的消息排序。
   旧实现：时间戳相同 → 用 id 字典序做 tie-break。
   但 id 形如 dm_<时间36进制>_<随机后缀>，随机后缀导致**同一毫秒内的多条
   消息顺序是随机的**（每次刷新都可能换一次顺序）→ 气泡左右穿插，
   看起来就是「聊天记录乱跳」。
   新实现：时间戳升序；时间戳完全相同 → 保持传入数组的原始顺序
   （Array.prototype.sort 在现代引擎上是稳定排序），
   原始顺序 = 服务端数组顺序（已按时间排好）→ 顺序稳定可预期。 */
function sortChatStable(list) {
  var arr = Array.isArray(list) ? list.slice() : [];
  arr.sort(function (a, b) {
    var ta = Number((a && a.createdAtMs) || 0);
    var tb = Number((b && b.createdAtMs) || 0);
    if (ta !== tb) return ta - tb;
    return 0; // 相等 → 稳定排序，保持原顺序
  });
  return arr;
}
/* 【修复·消息归属判断】气泡左右靠 from/to 双向判定。
   旧实现只看 m.from === S.me，遇到后端补全了 to 字段、
   或 from 缺失/大小写不一致时就会判错边（自己的消息显示在左边）。
   现在：
     · to === 我        → 右侧（我的）
     · from === 我      → 右侧（我的）
     · from === 对端    → 左侧（对方的）
     · to   === 对端    → 左侧（对方的）
     · 兜底：from === 我 → 右侧 */
function isMineMessage(m, peer) {
  if (!m) return false;
  var me = String(S.me || "");
  var from = String(m.from || "");
  var to = String(m.to || "");
  /* from === 我  → 我发出去的 → 右侧
     to   === 我  → 对方发给我的 → 左侧
     from === 对端 → 左侧；to === 对端 → 右侧 */
  if (from && from === me) return true;
  if (to && to === me) return false;
  if (peer && from === String(peer)) return false;
  if (peer && to === String(peer)) return true;
  /* 兜底：只有 from 时按 from 判；都没有 → 当对方的 */
  return false;
}
/* 【修复·重复气泡】合并本地乐观气泡 + 服务端快照。
   ① 服务端数组**自身**可能含重复 id（后端重复写入 / 多次快照叠加），
      旧实现直接把整份 incoming 塞进结果 → 同一 id 出现两条气泡。
      现在按 id 去重（保留第一条）。
   ② 本地无 id 的乐观气泡按「from + 正文 + 时间接近」匹配服务端同一条，
      但**同一条服务端消息只能被匹配掉一次**：
      旧实现没有这个限制 → 连发两条相同内容时，第二条被误判成重复而消失。 */
function mergeChatMessages(local, incoming) {
  var incomingArr = Array.isArray(incoming) ? incoming : [];
  var localArr = Array.isArray(local) ? local : [];
  var result = [];
  var byId = {};
  var usedLocal = {};
  var i, j, m, sid;

  // ① 服务端消息（按 id 去重）
  for (i = 0; i < incomingArr.length; i++) {
    m = incomingArr[i];
    if (!m) continue;
    sid = String(m.id || "");
    if (sid) {
      if (byId[sid]) continue; // 重复 id → 跳过
      byId[sid] = m;
    }
    result.push(m);
  }
  // ② 本地气泡
  for (i = 0; i < localArr.length; i++) {
    m = localArr[i];
    if (!m) continue;
    sid = String(m.id || "");
    if (sid) {
      if (byId[sid]) continue; // 服务端已有同 id → 已在上面积里
      result.push(m);
      continue;
    }
    var matched = false;
    for (j = 0; j < incomingArr.length; j++) {
      if (usedLocal[j]) continue;          // 这条服务端消息已被匹配过
      var im = incomingArr[j] || {};
      var imid = String(im.id || "");
      if (imid && byId[imid] !== im) continue; // 被去重掉的重复项
      if (String(im.from || "") !== String(m.from || "")) continue;
      if (String(im.text || "") !== String(m.text || "")) continue;
      var t1 = Number(im.createdAtMs || 0), t2 = Number(m.createdAtMs || 0);
      if (t1 && t2 && Math.abs(t1 - t2) > 5000) continue;
      usedLocal[j] = true;
      matched = true;
      break;
    }
    if (!matched) result.push(m); // 服务端还没有 → 保留本地气泡
  }
  return result;
}

/* 【新增】日期工具：用于聊天区的「今天 / 昨天 / M月D日」分隔线 */
function dayKeyOf(ts) {
  var d = new Date(Number(ts) || 0);
  if (isNaN(d.getTime()) || !Number(ts)) return "";
  return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
}
function dayLabelOf(ts) {
  var d = new Date(Number(ts) || 0);
  if (isNaN(d.getTime()) || !Number(ts)) return "";
  var now = new Date();
  var dd = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  var td = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  var diff = Math.round((dd - td) / 86400000);
  if (diff === 0) return "今天";
  if (diff === 1) return "昨天";
  var hm = String(d.getHours());
  var mm = String(d.getMinutes());
  if (hm.length < 2) hm = "0" + hm;
  if (mm.length < 2) mm = "0" + mm;
  return (d.getMonth() + 1) + "月" + d.getDate() + "日 " + hm + ":" + mm;
}
function renderChat(peer, messages) {
  S.view = "chat";
  S.chatPeer = peer;
  /* 【修复·用户消息不显示】
     旧实现：S.chatMessages = messages 直接覆盖引用。
     而 doSend 里是先 messages.push(本地乐观气泡) 再 renderChat(peer, messages)，
     renderChat 又把 S.chatMessages 指向同一个数组 —— 看起来没问题。
     但 openChat 的异步回调、以及 syncAiReplies 完成后都会用**服务端返回的
     快照**再次 renderChat，本地乐观气泡（还没落库完成、或落库了但快照早于它）
     就被整批覆盖掉 → 用户刚发的消息不见了。
     现在改成：按 id 合并「服务端快照 + 本地乐观气泡」，去重且都保留。 */
  var incoming = Array.isArray(messages) ? messages : [];
  var local = Array.isArray(S.chatMessages) ? S.chatMessages : [];
  var merged = mergeChatMessages(local, incoming);
  S.chatMessages = merged;
  elTopTitle.textContent = chatTitleFor(peer);
  // 顶栏头像显示「对方」（跟 AI 聊天就显示 AI 的头像）
  updateChatTopAvatar(peer);
  // 进入会话详情后不再显示「All ⌄」筛选按钮
  setDmFilterVisible(false);
  elScroll.classList.add("chat-mode");

  /* 【修复·顺序错乱】按时间戳升序渲染，保证气泡顺序 = 真实时间顺序。
     服务端已排序，这里再兜一次底（本地乐观气泡用 Date.now()）。 */
  var ordered = sortChatStable(merged);

  /* ================================================================
   【性能·长文本折叠】私信里 AI 的回复动辄几百上千字（还带 Markdown 标记），
   一次性把 21 条长文本全量塞进 innerHTML，光是 HTML 字符串拼接 +
   浏览器排版就要几百 ms —— 这是「打开聊天界面卡一下」的最大单一开销。
   现在长消息默认只渲染前 220 字，点「展开」才显示全文。
   折叠时正文里塞一份完整原文到 data-full，点击时切换显示。
   ================================================================ */
var BUBBLE_PREVIEW_LEN = 220;
function bubbleHtml(m, peer) {
  var mine = isMineMessage(m, peer);
  var text = m.text ? String(m.text) : "";
  var inner = '';
  if (text) {
    if (text.length > BUBBLE_PREVIEW_LEN) {
      var preview = esc(text.slice(0, BUBBLE_PREVIEW_LEN));
      inner += '<span class="bubble-text" data-collapsed="1" data-full="' + esc(text) + '">' + preview +
        '<button class="bubble-more" data-expand="1">…展开</button></span>';
    } else {
      inner += '<span class="bubble-text">' + esc(text) + '</span>';
    }
  }
  (m.attachments || []).forEach(function (a) {
    var src = mediaUrl(a.path);
    inner += a.type === "video"
      ? '<video src="' + esc(src) + '" controls playsinline></video>'
      : '<img src="' + esc(src) + '" data-img="' + esc(src) + '" />';
  });
  return '<div class="bubble-row ' + (mine ? "mine" : "theirs") + '">' +
    '<div class="bubble">' + inner + '</div>' +
    '</div>';
}

/* 【新增·日期分隔线】按天分组插入分隔条，分隔线的日期取气泡自己的时间戳，
   与气泡顺序严格一致，不会出现「日期条插在错误位置」。
   注意不能用 map(bubbleHtml) —— map 会把下标当第二个参数传给 bubbleHtml，
   第二个参数现在是 peer，必须显式包一层。 */
var bubbles = "";
var lastDayKey = "";
ordered.forEach(function (m) {
  var ts = Number((m && m.createdAtMs) || 0);
  var dk = ts ? dayKeyOf(ts) : "";
  if (dk && dk !== lastDayKey) {
    bubbles += '<div class="chat-day-sep"><span>' + esc(dayLabelOf(ts)) + '</span></div>';
    lastDayKey = dk;
  }
  bubbles += bubbleHtml(m, peer);
});

  /* ================================================================
     【性能·增量渲染】原来每次 renderChat 都把整个 elScroll.innerHTML 重建，
     连带把输入框、发送按钮、图片按钮全部销毁再重建 + 重新绑事件。
     消息一多（现在有 21 条，其中几条是长文本），这就是「打开聊天卡一下」的主因。
     现在改成：
       · 只在**第一次**进入会话时构建骨架（chatView / chatList / 输入区）
       · 之后只替换 chatList 的内容（innerHTML 只动消息区）
       · 输入框不再被销毁 → 打字不丢焦点、不掉光标
     ================================================================ */
  var chatList = document.getElementById("chatList");
  if (!chatList) {
    // 第一次：构建骨架
    elScroll.innerHTML =
      '<div id="chatView">' +
        '<div id="chatBindTipHost"></div>' +
        '<div class="chat-list" id="chatList"></div>' +
        '<div class="chat-input-row">' +
          '<button class="tool-btn" id="chatPick" style="width:36px;height:36px;">' + SVG.image + '</button>' +
          '<textarea id="chatInput" rows="1" placeholder="发消息…"></textarea>' +
          '<button class="send-btn" id="chatSend" style="height:36px;">发送</button>' +
        '</div>' +
      '</div>';
    chatList = document.getElementById("chatList");
    bindChatControls();
  } else {
    // 后续：只更新消息区，输入框保持不动
    chatList.innerHTML = bubbles || '<div class="empty">还没有消息，打个招呼吧</div>';
  }
  if (chatList) chatList.scrollTop = chatList.scrollHeight;

  // 绑定提示条单独更新（内容会随绑定状态变化）
  var tipHost = document.getElementById("chatBindTipHost");
  if (tipHost) {
    var boundChatNow = (S.chatLinks && S.chatLinks[peer]) || "";
    tipHost.innerHTML = peer === "ai"
      ? '<div class="chat-bind-tip' + (boundChatNow ? " on" : "") + '">' +
          (boundChatNow ? "已连接 Operit 对话，消息会转发给角色卡" : "未绑定对话：请在私信列表选择要桥接的对话") +
        '</div>'
      : '';
  }
}

/* 聊天页的输入控件事件（只在首次构建骨架时绑定一次）
   【重要】所有 handler 里的 peer 都从 S.chatPeer 动态取，
   不能用闭包捕获的 peer —— 否则切换会话后，
   输入框/发送按钮会被复用（不再重建），但事件还绑在旧会话上，
   会把消息发到错误的会话。 */
function bindChatControls() {
  var input = document.getElementById("chatInput");
  var send = document.getElementById("chatSend");
  var pick = document.getElementById("chatPick");

  function doSend() {
    var peer = S.chatPeer || "ai";   // 动态取当前会话
    var text = input ? String(input.value || "").trim() : "";
    var media = S.pendingMedia.slice();
    if (!text && !media.length) return;
    if (send) send.disabled = true;
    var params = { actor: S.me, peer: peer, text: text };
    var imgs = [], vids = [], imgData = [], vidData = [];
    media.forEach(function (m) {
      if (m.data) {
        if (m.type === "video") vidData.push({ data: m.data, name: m.name || "video.mp4" });
        else imgData.push({ data: m.data, name: m.name || "image.jpg" });
      } else if (m.path) {
        if (m.type === "video") vids.push(m.path); else imgs.push(m.path);
      }
    });
    if (imgs.length) params.imagePaths = imgs;
    if (vids.length) params.videoPaths = vids;
    if (imgData.length) params.imageData = imgData;
    if (vidData.length) params.videoData = vidData;

    XBridge.callTool("x_social:dmSend", params).then(function (r) {
      if (send) send.disabled = false;
      if (r && r.success === false) {
        showToast(r.message || "发送失败");
        return;
      }
      S.pendingMedia = [];
      if (input) { input.value = ""; input.style.height = "auto"; }
      /* 【修复·用户消息不显示 / 重复】
         旧实现：messages.push(...) —— messages 是进入 renderChat 时传进来的**参数引用**，
         而 renderChat 内部已经改成了 mergeChatMessages(local, incoming) 生成**新数组**，
         S.chatMessages 指向新数组。此时 push 到旧 messages 上，S.chatMessages 根本看不到。
         现在统一 push 到 S.chatMessages（真正的当前列表），并带 createdAtMs 供排序。

         【修复·对话记录混乱·用户消息时间戳】
         旧实现：本地气泡用 Date.now() 当时间戳，而服务端 dmSend 也用 Date.now()。
         两者相差几十毫秒 → 后续合并时只能靠 ±2s 时间窗去匹配，
         一旦网络/IO 抖动超过 2 秒，同一条消息就会**重复成两条**。
         现在优先用服务端返回的 message（带真实 id + createdAtMs），
         服务端没有返回时才退回本地 Date.now()。
         有真实 id 就能走 mergeChatMessages 的 id 去重，重复问题彻底消失。 */
      var serverMsg = (r && (r.data || r) && (r.data || r).message) || null;
      var localMsg = serverMsg ? {
        id: String(serverMsg.id || ""),
        from: serverMsg.from || S.me,
        text: serverMsg.text !== undefined ? serverMsg.text : text,
        createdAtMs: Number(serverMsg.createdAtMs || Date.now()),
        attachments: serverMsg.attachments || media.map(function (m) {
          return { type: m.type, path: m.path, name: m.name };
        })
      } : {
        id: "",
        from: S.me,
        text: text,
        createdAtMs: Date.now(),
        attachments: media.map(function (m) {
          return { type: m.type, path: m.path, name: m.name };
        })
      };
      S.chatMessages = mergeChatMessages(S.chatMessages, [localMsg]);
      renderChat(peer, S.chatMessages);
      var bound = (S.chatLinks && S.chatLinks[peer]) || "";
      if (peer === "ai" && bound && text) {
        showToast("已发送，角色正在回复…");
        /* 桥接（v20）：走 UI 帧直连对话。
           ① 先读一次历史，拿到「发送前最后一条 AI 回复的时间戳」作为基准
           ② UI 帧 chatSend 把消息送进绑定对话（不受包运行时的 busy 保护限制）
           ③ 开始轮询历史，AI 出现**新于基准**的回复后落库回 X 私信
           【修复】基准从「正文前缀指纹」改成「时间戳」：
           旧实现按前 200 字符比对，新旧回复开头相同就会被误判成旧回复，
           导致「消息发出后收不到 AI 回复」。 */
        XBridge.chatHistory(bound, 6).then(function (hr) {
          var beforeTs = 0;
          try {
            var hd = (hr && hr.data) || {};
            var hmsgs = Array.isArray(hd.messages) ? hd.messages : [];
            for (var i = hmsgs.length - 1; i >= 0; i--) {
              var hm = hmsgs[i] || {};
              var hs = String(hm.sender || "");
              if (hs !== "ai" && hs !== "assistant" && hs !== "bot") continue;
              beforeTs = Number(hm.timestamp || 0);
              break;
            }
          } catch (e) { }
          return XBridge.chatSend(bound, text).then(function (sr) {
            if (sr && sr.success === false) {
              showToast("转发失败: " + (sr.message || ""));
              return;
            }
            pollBridgeReply(peer, S.chatMessages.length, bound, beforeTs);
          });
        });
      } else {
        if (peer !== "ai") pollChatReply(peer, S.chatMessages.length);
        showToast("已发送");
      }
    });
  }

  if (send) send.addEventListener("click", doSend);
  if (input) {
    input.addEventListener("input", function () {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 110) + "px";
    });
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        doSend();
      }
    });
  }
  if (pick) {
    pick.addEventListener("click", function () {
      pickFromHost("image", true).then(function (r) {
        if (r.files.length) {
          r.files.forEach(function (f) { S.pendingMedia.push({ path: f.path, type: "image" }); });
          showToast("已选择 " + r.files.length + " 个文件，点发送即可");
          return;
        }
        pickViaInput("image").then(function (vr) {
          var list = (vr && Array.isArray(vr.files)) ? vr.files : [];
          if (list.length) {
            list.forEach(function (f) {
              S.pendingMedia.push({ path: "", data: f.data, name: f.name || "image.jpg", type: "image" });
            });
            /* 【修复·多图提示】把「超出上限被丢弃的张数」明确告诉用户，
               而不是静默丢掉让用户以为全部选上了。 */
            var dropped = Number(vr && vr.dropped) || 0;
            showToast("已选择 " + list.length + " 张图片" +
              (dropped > 0 ? "（另有 " + dropped + " 张超过 9 张上限未添加）" : "") +
              "，点发送即可");
            return;
          }
          var msg = (r && r.message) || (vr && vr.message) || "";
          if (msg) showToast(msg);
          askManualChatMedia();
        });
      });
    });
  }
}
/* 聊天里手动补媒体路径 */
function askManualChatMedia() {
  showPromptSheet("图片/视频路径", "/sdcard/...").then(function (p) {
    if (!p) return;

    if (!v) return;

    S.pendingMedia.push({ path: v, type: isVid ? "video" : "image" });

  });
}

function openChat(peer) {
  /* 【修复·会话切换错乱】① 自增竞态令牌，旧的异步回调全部作废
     ② 立刻清空当前消息并渲染空壳，避免上一个会话的气泡残留 */
  var myToken = ++S.chatToken;
  stopChatPoll();
  /* 【性能】进入聊天时暂停首页轮询（每 3 秒一次 status，
     后端每次全量读 42KB state.json），避免和聊天加载抢 IO。 */
  stopFeedPoller();
  S.pendingMedia = [];
  var prevPeer = S.chatPeer;
  S.chatPeer = peer;
  S.chatMessages = [];
  /* 【性能·增量渲染】输入框现在会被复用（不再每次重建），
     所以切换会话时必须手动清空，否则上一句草稿会带到新会话。 */
  if (prevPeer !== peer) {
    var inp = document.getElementById("chatInput");
    if (inp) { inp.value = ""; inp.style.height = "auto"; }
  }
  var bb = document.getElementById("backBtn");
  if (bb) bb.style.display = "";
  // 立刻画出空壳（不等数据回来）—— 让界面马上响应，不至于「点一下卡半秒」
  renderChat(peer, []);

  /* 【性能】原来打开会话要连打 5~6 次工具：
       dmRead + dmMessages + dmList + chatLinks + notifications + aiReplyCursor
     每次都是「宿主 ↔ 包运行时」一次往返（几百 ms），叠起来就是明显的卡顿。
     现在改成 1 次 chatBundle 聚合调用，一次拿全所有数据。
     数据语义完全不变（合并了 markRead / 已读标记 / 绑定信息 / 游标）。 */
  XBridge.callTool("x_social:chatBundle", {
    actor: S.me, peer: peer, limit: 200,
    markRead: true,
    includeThreads: true,
    includeNotifications: true,
    includeChatLinks: true
  }).then(function (r) {
    /* 【修复】令牌校验：用户已切走就别再渲染，避免旧数据覆盖新会话 */
    if (myToken !== S.chatToken) return;
    if (!r || r.success === false) {
      showToast((r && r.message) || "加载失败");
      return;
    }
    var d = (r && (r.data || r)) || {};

    // 账号资料
    if (d.peerAccount) S.accounts[peer] = d.peerAccount;
    if (d.accounts && typeof d.accounts === "object") {
      for (var ak in d.accounts) {
        if (Object.prototype.hasOwnProperty.call(d.accounts, ak)) {
          S.accounts[ak] = d.accounts[ak];
        }
      }
      updateMeAvatar();
    }
    // 会话列表（角标 + 私信列表页都要用）
    if (Array.isArray(d.threads)) {
      S.threads = d.threads;
      updateBadges();
    }
    // 通知（角标）
    if (Array.isArray(d.notifications)) {
      S.notifications = d.notifications;
      updateBadges();
    }
    // 对话绑定
    if (d.links) S.chatLinks = d.links;
    if (d.meta) S.chatLinkMeta = d.meta;
    S.chatLinksLoaded = true;
    /* 【修复·绑定下拉框空白】chatBundle 已经把全部对话的 meta 带回来了，
       这里直接把它喂给下拉框 —— 不再依赖 listChats 那一次额外调用。
       否则 listChats 抖动一次，下拉框就只剩「未绑定（本机模拟）」，
       看起来像绑定丢了（其实后台绑定一直都在）。 */
    if (d.meta && typeof d.meta === "object") {
      var optsFromMeta = [];
      for (var mk in d.meta) {
        if (!Object.prototype.hasOwnProperty.call(d.meta, mk)) continue;
        var mv = d.meta[mk] || {};
        optsFromMeta.push({
          id: String(mk),
          title: String(mv.title || ""),
          characterCardId: String(mv.characterCardId || ""),
          characterCardName: String(mv.characterCardName || ""),
          displayName: String(mv.displayName || ""),
          isCurrent: !!mv.isCurrent
        });
      }
      if (optsFromMeta.length && !S.chatOptions.length) {
        S.chatOptions = optsFromMeta;
        S.chatOptionsReady = true;
      }
    }

    // 消息
    renderChat(peer, Array.isArray(d.messages) ? d.messages : []);

    /* 【v20】进入 AI 聊天时，从绑定对话里同步一次最新的 AI 回复。
       【修复·只同步新回复】这里**不再**无条件灌入对话里的历史回复，
       而是走 aiReplyCursor 游标：只有比游标更新的回复才会写进 X 私信。
       否则每次切换会话都会把「切换前 AI 的回复」重新灌一遍，
       导致私信里旧回复堆积、顺序错乱。
       【性能】游标已经由 chatBundle 一并带回来了，不用再单独调一次工具。 */
    if (peer === "ai") {
      var boundNow = (S.chatLinks && S.chatLinks["ai"]) || "";
      if (boundNow) syncAiRepliesFromChat(peer, boundNow, myToken, Number(d.cursor || 0));
    }
  }).catch(function () {
    if (myToken !== S.chatToken) return;
    showToast("加载失败");
  });
}

/* 从绑定对话读回最近的 AI 回复，写入 X 私信（去重由后端 aiReply 保证）
   *
   * 【修复·旧回复刷屏 / 消息错乱】
   * 旧实现：每次进入会话都把对话里最近 3 条 AI 回复**无条件**写进 X 私信。
   * 后果 A：切换会话时，「切换前的 AI 回复」又被灌一遍 → 私信里旧回复堆积。
   * 后果 B：这些回复的时间戳是**写入时刻**，不是回复产生时刻，
   *         于是它们插在用户新消息旁边 → 气泡顺序错乱。
   *
   * 新实现：
   *   ① 先取 aiReplyCursor 游标（= 已同步到的最新回复时间）
   *   ② 只把「对话里时间戳 > 游标」的回复写进私信
   *   ③ 写入时带上 sinceTs=游标，后端再挡一次（双保险）
   *   ④ 整个过程带竞态令牌，切走就不写
   */
function syncAiRepliesFromChat(peer, chatId, token, knownCursor) {
  /* 【性能】knownCursor 由 chatBundle 一并带回 → 省掉一次 aiReplyCursor 工具调用。
     没传时才自己取一次。 */
  var cursorPromise = (knownCursor !== undefined && knownCursor !== null)
    ? Promise.resolve(Number(knownCursor || 0))
    : XBridge.callTool("x_social:aiReplyCursor", { peer: peer, actor: S.me }).then(function (cr) {
        var cd = (cr && (cr.data || cr)) || {};
        return Number(cd.cursor || 0);
      }).catch(function () { return 0; });

  cursorPromise.then(function (sinceTs) {
    if (token !== undefined && token !== S.chatToken) return;
    return XBridge.chatHistory(chatId, 20).then(function (hr) {
      if (token !== undefined && token !== S.chatToken) return;
      if (!hr || hr.success === false) return;
      var hd = (hr && hr.data) || {};
      var msgs = Array.isArray(hd.messages) ? hd.messages : [];
      if (!msgs.length) return;
      // 从新到旧遍历，只取比游标更新的回复（最多 3 条，避免一次灌太多）
      var picked = [];
      for (var i = msgs.length - 1; i >= 0 && picked.length < 3; i--) {
        var m = msgs[i] || {};
        var sender = String(m.sender || "");
        if (sender !== "ai" && sender !== "assistant" && sender !== "bot") continue;
        var ts = Number(m.timestamp || 0);
        if (sinceTs > 0 && ts > 0 && ts <= sinceTs) continue; // 旧回复，跳过
        var text = cleanChatText(m.content);
        if (!text) continue;
        picked.push({ text: text, ts: ts });
      }
      if (!picked.length) return;
      // 从旧到新写入，保证私信里顺序 = 回复产生顺序
      picked.reverse();
      var chain = Promise.resolve();
      picked.forEach(function (it) {
        chain = chain.then(function () {
          if (token !== undefined && token !== S.chatToken) return;
          return XBridge.callTool("x_social:aiReply", {
            text: it.text, peer: peer, actor: S.me,
            sinceTs: sinceTs,
            // 【修复·对话记录混乱】把对话里的真实时间戳传下去，
            // 后端用它当消息时间 → 气泡顺序 = 真实对话顺序，
            // 而不是全部挤在「我打开聊天页的那一刻」。
            sourceTs: it.ts,
            dedupe: "aichat:" + String(chatId) + ":" + (it.ts || 0) + ":" + it.text.slice(0, 60)
          });
        });
      });
      chain.then(function () {
        if (token !== undefined && token !== S.chatToken) return;
        return XBridge.callTool("x_social:dmMessages", { actor: S.me, peer: peer, limit: 200 });
      }).then(function (rr) {
        if (token !== undefined && token !== S.chatToken) return;
        if (S.view === "chat" && S.chatPeer === peer) {
          var dd = (rr && (rr.data || rr)) || {};
          renderChat(peer, Array.isArray(dd.messages) ? dd.messages : []);
        }
      });
    });
  }).catch(function () { });
}

function paintProfile(d, fromCache) {

function openEditProfile(acc, who) {
  var target = String(who || (acc && acc.id) || S.me);
  var colors = ["#1D9BF0", "#7856FF", "#F91880", "#00BA7C", "#FF7A00", "#536471"];
  var curColor = acc.avatarColor || "#1D9BF0";
  var isAi = target === "ai";
  openSheet('' +
    '<div class="sheet-title">编辑资料</div>' +
    '<div class="sheet-sub">修改后立即生效' + (isAi ? '（正在编辑 AI 账号）' : '') + '</div>' +
    '<div class="avatar-edit-row">' +
      '<div class="avatar" id="epAvatar" style="' + (acc.avatarPath ? "background:#222" : "background:" + curColor) + '">' +
        (acc.avatarPath ? '<img src="' + esc(mediaUrl(acc.avatarPath)) + '" />' : esc(iniFor(acc.displayName, acc.handle))) +
      '</div>' +
      '<div style="display:flex;flex-direction:column;gap:6px;">' +
        '<button class="pill-mini" id="epPickAvatar">更换头像</button>' +
        '<button class="pill-mini" id="epClearAvatar">清除头像</button>' +
      '</div>' +
    '</div>' +
    '<div class="field" style="margin-top:14px;"><label>昵称</label><input id="epName" maxlength="40" value="' + esc(acc.displayName || "") + '" /></div>' +
    '<div class="field"><label>用户名</label><input id="epHandle" maxlength="20" value="' + esc(String(acc.handle || "").replace(/^@+/, "")) + '" /></div>' +
    '<div class="field"><label>简介</label><textarea id="epBio" maxlength="200">' + esc(acc.bio || "") + '</textarea></div>' +
    '<div class="field"><label>头像底色</label><div class="swatches" id="epColors">' +
      colors.map(function (c) {
        return '<button class="swatch' + (c.toLowerCase() === String(curColor).toLowerCase() ? " on" : "") + '" data-color="' + c + '" style="background:' + c + '"></button>';
      }).join("") +
    '</div></div>' +
    '<div class="sheet-row">' +
      '<button class="btn-ghost" id="epCancel">取消</button>' +
      '<button class="btn-solid" id="epSave">保存</button>' +
    '</div>');

  var pickedPath = acc.avatarPath || "";
  var pickedColor = curColor;
  var nameEl = document.getElementById("epName");
  var handleEl = document.getElementById("epHandle");
  var bioEl = document.getElementById("epBio");
  var avatarEl = document.getElementById("epAvatar");

  function refreshAvatarPreview() {
    if (!avatarEl) return;
    avatarEl.setAttribute("style", pickedPath ? "background:#222" : "background:" + pickedColor);
    avatarEl.innerHTML = pickedPath ? '<img src="' + esc(mediaUrl(pickedPath)) + '" />' : esc(iniFor(nameEl ? nameEl.value : "", handleEl ? handleEl.value : ""));
  }

  var colorsBox = document.getElementById("epColors");
  if (colorsBox) {
    colorsBox.addEventListener("click", function (e) {
      var t = e.target && e.target.closest ? e.target.closest("[data-color]") : null;
      if (!t) return;
      pickedColor = t.getAttribute("data-color");
      Array.prototype.forEach.call(colorsBox.children, function (b) {
        b.classList.toggle("on", b === t);
      });
      refreshAvatarPreview();
    });
  }

  var pick = document.getElementById("epPickAvatar");
  if (pick) {
    pick.addEventListener("click", function () {
      XBridge.pickMedia("image", false).then(function (r) {
        if (r && !r.cancelled) {
          var files = Array.isArray(r.files) ? r.files : [];
          var f = files[0];
          var p = f ? (typeof f === "string" ? f : (f.path || f.uri || f.filePath || "")) : "";
          if (p) {
            pickedPath = p;
            refreshAvatarPreview();
            return;
          }
        }
        if (r && r.message) showToast(r.message);
        var manual = null;
        openSheetPathFallback();
      });
    });
  }
  function openSheetPathFallback() {
    // 弹一个极简输入层，避免破坏底部弹层结构
    var p = showPromptSheet("头像图片路径", "/sdcard/...");
    if (!p) return;
    p.then(function (val) {
      if (!val) return;
      pickedPath = String(val).trim();
      // 重新打开编辑面板以刷新预览
      openEditProfile(Object.assign({}, acc, { avatarPath: pickedPath, avatarColor: pickedColor }));
    });
  }
  var clearBtn = document.getElementById("epClearAvatar");
  if (clearBtn) {
    clearBtn.addEventListener("click", function () {
      pickedPath = "";
      refreshAvatarPreview();
    });
  }
  if (nameEl) nameEl.addEventListener("input", refreshAvatarPreview);

  var cancel = document.getElementById("epCancel");
  if (cancel) cancel.addEventListener("click", closeSheet);

  var save = document.getElementById("epSave");
  if (save) {
    save.addEventListener("click", function () {
      save.disabled = true;
      save.textContent = "保存中";
      var payload = { who: target };
      if (nameEl) payload.displayName = String(nameEl.value || "").trim();
      if (handleEl) payload.handle = String(handleEl.value || "").trim();
      if (bioEl) payload.bio = String(bioEl.value || "");
      payload.avatarColor = pickedColor;
      payload.avatarPath = pickedPath || "";
      XBridge.callTool("x_social:updateProfile", payload).then(function (r) {
        save.disabled = false;
        save.textContent = "保存";
        if (r && r.success === false) { showToast(r.message || "保存失败"); return; }
        closeSheet();
        showToast("资料已更新");
        // 同步本地缓存，立刻反映新昵称/头像
        if (r && r.data && r.data.account) S.accounts[target] = r.data.account;
        if (target === S.me) updateMeAvatar();
        else updateChatTopAvatar(S.chatPeer);
        refreshFeed();
        if (S.profileWho === target) renderProfile(target);
      });
    });
  }
}
/* 通用确认弹层（替代 WebView 里不可靠的 confirm） */

/* 通用单行输入弹层：返回 Promise<string|null> */
function showPromptSheet(title, placeholder) {
  return new Promise(function (resolve) {
    openSheet('' +
      '<div class="sheet-title">' + esc(title) + '</div>' +
      '<div class="field" style="margin-top:10px;"><input id="promptInput" placeholder="' + esc(placeholder || "") + '" /></div>' +
      '<div class="sheet-row">' +
        '<button class="btn-ghost" id="promptCancel">取消</button>' +
        '<button class="btn-solid" id="promptOk">确定</button>' +
      '</div>');
    var input = document.getElementById("promptInput");
    var done = function (v) { closeSheet(); resolve(v); };
    var cancel = document.getElementById("promptCancel");
    var ok = document.getElementById("promptOk");
    if (cancel) cancel.addEventListener("click", function () { done(null); });
    if (ok) ok.addEventListener("click", function () { done(input ? input.value : ""); });
    if (input) setTimeout(function () { try { input.focus(); } catch (e) { } }, 60);
  });
}

/* ---------------- 渲染：搜索 ---------------- */
function renderSearch() {
  S.view = "list";
  elTopTitle.textContent = "搜索";
  var trends = [

  ];
  elScroll.innerHTML = '' +
    '<div class="search-wrap">' +
      '<div class="search-input-wrap">' +
        '<svg viewBox="0 0 24 24"><path d="M10.25 3.75c-3.59 0-6.5 2.91-6.5 6.5s2.91 6.5 6.5 6.5c1.795 0 3.419-.726 4.596-1.904 1.178-1.177 1.904-2.801 1.904-4.596 0-3.59-2.91-6.5-6.5-6.5zm-8.5 6.5c0-4.694 3.806-8.5 8.5-8.5s8.5 3.806 8.5 8.5c0 1.986-.682 3.815-1.824 5.262l4.781 4.781-1.414 1.414-4.781-4.781c-1.447 1.142-3.276 1.824-5.262 1.824-4.694 0-8.5-3.806-8.5-8.5z"/></svg>' +
        '<input id="searchInput" placeholder="搜索帖子、用户" />' +
      '</div>' +
    '</div>' +
    '<div id="searchResults"></div>' +
    '<div id="trendList">' +
      trends.map(function (t) {
        return '<div class="trend-row" data-trend="' + esc(t.topic) + '"><div class="trend-meta">' + esc(t.meta) + '</div>' +
          '<div class="trend-topic">' + esc(t.topic) + '</div>' +
          '<div class="trend-count">' + esc(t.count) + '</div></div>';
      }).join('') +
    '</div>';
  var input = document.getElementById("searchInput");
  if (!input) return;
  function runSearch() {
    var q = input.value.trim().toLowerCase();
    var res = document.getElementById("searchResults");
    var tr = document.getElementById("trendList");
    if (!res) return;
    if (!q) {
      res.innerHTML = "";
      if (tr) tr.style.display = "";
      return;
    }
    if (tr) tr.style.display = "none";
    // 先本地匹配（快），再补一次服务端全量搜索（准）
    var localHits = S.posts.filter(function (p) {
      return String(p.text || "").toLowerCase().indexOf(q) >= 0 ||
        String(p.authorHandle || "").toLowerCase().indexOf(q) >= 0 ||
        String(p.authorDisplayName || "").toLowerCase().indexOf(q) >= 0;
    });
    var users = Object.keys(S.accounts).map(function (k) { return S.accounts[k]; }).filter(function (a) {
      return String(a.displayName || "").toLowerCase().indexOf(q) >= 0 ||
        String(a.handle || "").toLowerCase().indexOf(q) >= 0;
    });
    function paint(posts, us) {
      var html = "";
      if (us.length) {
        html += '<div class="sheet-sub" style="padding:10px 14px 4px;margin:0;">用户</div>';
        html += us.map(function (a) {
          return '<div class="user-row" data-goto-author="' + esc(a.id) + '">' +
            '<div class="avatar" style="' + avatarStyle(a.id) + '">' + avatarInner(a.id) + '</div>' +
            '<div class="user-main">' +
              '<div class="user-name">' + esc(a.displayName || a.id) + (a.id === "ai" ? " " + SVG.verified : "") + '</div>' +
              '<div class="user-handle">' + esc(a.handle || ("@" + a.id)) + '</div>' +
            '</div></div>';
        }).join("");
      }
      if (posts.length) {
        html += (us.length ? '<div class="sheet-sub" style="padding:10px 14px 4px;margin:0;">帖子</div>' : "");
        html += posts.map(postHTML).join("");
      }
      res.innerHTML = html || '<div class="empty">没有找到相关内容</div>';
    }
    paint(localHits, users);
    // 服务端全量（覆盖本地未加载的历史帖子）
    XBridge.callTool("x_social:search", { q: input.value.trim(), limit: 60 }).then(function (r) {
      if (!r || r.success === false) return;
      var d = (r.data || r) || {};
      var posts = Array.isArray(d.posts) ? d.posts : [];
      var us = Array.isArray(d.accounts) ? d.accounts : [];
      if (!posts.length && !us.length) return;
      us.forEach(function (a) { S.accounts[a.id] = a; });
      paint(posts, us);
    });
  }
  input.addEventListener("input", runSearch);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); input.blur(); runSearch(); }
  });
}

/* ---------------- 发帖 ---------------- */
function renderMediaPreview() {
  var box = document.getElementById("mediaPreview");
  if (!box) return;
  if (!S.pendingMedia.length) {
    box.innerHTML = "";
    box.style.display = "none";
    return;
  }
  box.style.display = "flex";
  box.innerHTML = S.pendingMedia.map(function (m, i) {
    var src = m.data || mediaUrl(m.path);
    return '<div class="media-chip">' +
      (m.type === "video"
        ? '<video src="' + esc(src) + '" muted playsinline></video>'
        : '<img src="' + esc(src) + '" />') +
      '<button class="rm" data-rm="' + i + '">×</button>' +
      '</div>';
  }).join('');
}

function bindComposer() {
  var input = document.getElementById("composerInput");
  var send = document.getElementById("composePost") || document.getElementById("sendBtn");
  var cancel = document.getElementById("composeCancel");

  function syncSend() {
    if (!send) return;
    var has = (input && input.value.trim().length > 0) || S.pendingMedia.length > 0;
    send.disabled = !has;
  }

  if (input) {
    input.addEventListener("input", function () {
      syncSend();
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 180) + "px";
    });
    syncSend();
  }
  if (cancel) {
    cancel.addEventListener("click", function () { closeComposer(); });
  }
  if (send) {
    send.addEventListener("click", function () {
      var text = input ? String(input.value || "").trim() : "";
      var media = S.pendingMedia.slice();
      if (!text && !media.length) return;
      send.disabled = true;
      send.textContent = "发送中";
      var params = { author: S.me, text: text };
      var imgs = [], vids = [], imgData = [], vidData = [];
      media.forEach(function (m) {
        if (m.data) {
          if (m.type === "video") vidData.push({ data: m.data, name: m.name || "video.mp4" });
          else imgData.push({ data: m.data, name: m.name || "image.jpg" });
        } else if (m.path) {
          if (m.type === "video") vids.push(m.path); else imgs.push(m.path);
        }
      });
      if (imgs.length) params.imagePaths = imgs;
      if (vids.length) params.videoPaths = vids;
      if (imgData.length) params.imageData = imgData;
      if (vidData.length) params.videoData = vidData;

      XBridge.callTool("x_social:post", params).then(function (r) {
        send.textContent = "发帖";
        if (r && r.success === false) {
          showToast(r.message || "发布失败");
          syncSend();
          return;
        }
        if (input) { input.value = ""; input.style.height = "auto"; }
        S.pendingMedia = [];
        renderMediaPreview();
        showToast("已发布");
        closeComposer();
        refreshFeed();
        /* ================================================================
           【需求·发帖流程时序修正】
           用户要求：「发布帖子成功后再提醒 AI」。
           旧实现的两个问题：
             ① 提醒 AI 的**回执**要等 AI 跑完整轮对话才弹出来
                → 期间发送按钮一直卡在「发送中」，看起来像界面死了；
             ② 桥接失败时弹「已发布，但未送达 AI」，同样被拖到很后面。
           现在改成：
             · 帖子落库成功 → 立刻关掉输入框、刷新列表、提示「已发布」；
             · 提醒 AI 放到**后台**做（不阻塞任何 UI 交互）；
             · 送达与否由后台静默处理，只在真失败时才提示。
           ================================================================ */
        var rd = (r && (r.data || r)) || {};
        var newPost = rd.post || null;
        if (newPost && newPost.id) {
          /* 【带图发帖·照片内容一起送给 AI】
             宿主有真正的多模态图片通道（link 标签 + 图片池）。
             这里调 describePostImages 把照片注册进宿主图片池，
             返回的标签追加到事件文案末尾 → 对话里的 AI 能直接看到照片本体。
             注册失败时它会自动降级为文字描述，不影响发帖本身。 */
          var atts = (newPost.attachments) || [];
          var hasImg = false;
          for (var ai2 = 0; ai2 < atts.length; ai2++) {
            if (atts[ai2] && atts[ai2].type === "image") { hasImg = true; break; }
          }
          /* 后台提醒 AI：setTimeout(0) 脱离当前调用栈，
             保证「已发布」的提示和界面刷新先落地，AI 的响应绝不拖住 UI。 */
          setTimeout(function () {
            if (hasImg) {
              XBridge.callTool("x_social:describePostImages", { postId: newPost.id, limit: 3 })
                .then(function (dr) {
                  var dd = (dr && (dr.data || dr)) || {};
                  var dlines = Array.isArray(dd.lines) ? dd.lines : [];
                  bridgeSocialEvent("post", newPost, null, { imageLines: dlines });
                })
                .catch(function () {
                  bridgeSocialEvent("post", newPost, null);
                });
            } else {
              bridgeSocialEvent("post", newPost, null);
            }
          }, 0);
        }
      });
    });
  }
}

function handlePick(kind) {
  var wantVideo = kind === "video";
  var type = wantVideo ? "video" : "image";
  function addPaths(files) {
    var added = 0;
    (files || []).forEach(function (f) {
      var p = typeof f === "string" ? f : (f && f.path) || "";
      if (!p) return;
      S.pendingMedia.push({ path: p, type: type });
      added++;
    });
    if (added) {
      renderMediaPreview();
      var send = document.getElementById("composePost") || document.getElementById("sendBtn");
      if (send) send.disabled = false;
      showToast("已添加 " + added + " 个文件");
    }
    return added;
  }
  function addBase64(list) {
    (list || []).forEach(function (f) {
      S.pendingMedia.push({
        path: "",
        data: f.data,
        name: f.name || (wantVideo ? "video.mp4" : "image.jpg"),
        type: type
      });
    });
    if (list && list.length) {
      renderMediaPreview();
      var send = document.getElementById("composePost") || document.getElementById("sendBtn");
      if (send) send.disabled = false;
      showToast("已添加 " + list.length + " 个文件");
    }
  }
  // 首选：宿主系统文件选择器（返回真实路径，工具端可直接复制进媒体库）
  pickFromHost(type, true).then(function (r) {
    if (r.files.length && addPaths(r.files)) return;
    // 次选：WebView 原生 input（拿 base64）
    return pickViaInput(kind).then(function (vr) {
      var list = (vr && Array.isArray(vr.files)) ? vr.files : [];
      if (list.length && addBase64(list)) return;
      var msg = (r && r.message) || (vr && vr.message) || "";
      if (msg) showToast(msg);
      askManualPath(type);
    });
  });
}
/* 手动输入媒体路径（宿主文件选择器不可用时的兜底） */
function askManualPath(kind) {
  var isVid = kind === "video";
  openSheet('' +
    '<div class="sheet-title">手动添加' + (isVid ? "视频" : "图片") + '</div>' +
    '<div class="sheet-sub">填入手机里的文件路径，例如 /sdcard/DCIM/Camera/a.jpg</div>' +
    '<div class="field"><label>文件路径</label><input id="manualPath" placeholder="/sdcard/..." /></div>' +
    '<div class="sheet-row">' +
      '<button class="btn-ghost" id="manualCancel">取消</button>' +
      '<button class="btn-solid" id="manualOk">添加</button>' +
    '</div>');
  var input = document.getElementById("manualPath");
  var cancel = document.getElementById("manualCancel");
  var ok = document.getElementById("manualOk");
  if (cancel) cancel.addEventListener("click", closeSheet);
  if (ok) ok.addEventListener("click", function () {
    var p = input ? String(input.value || "").trim() : "";
    if (!p) { showToast("请填写路径"); return; }
    S.pendingMedia.push({ path: p, type: isVid ? "video" : "image" });
    closeSheet();
    renderMediaPreview();
    var send = document.getElementById("composePost") || document.getElementById("sendBtn");
    if (send) send.disabled = false;
    showToast("已添加");
  });
}


/* ================================================================
   帖子二级详情页
   ---------------------------------------------------------------
   需求：点击推特帖子不再原地内联展开，而是打开一个全屏二级页面：
     顶部：返回按钮 + 「作者 · 时间」
     主体：作者/正文/话题、媒体（轮播，全部图片都显示，不再截断 4 张）、
           引用推文、互动数据（转发 / 点赞 / 评论数）
     底部：可展开的回复时间线 + 回复输入框
   降级：帖子无效 → 提示「推文不存在或已被删除」；
         加载失败 → 提示错误 + 重试按钮（仍展示本地已有内容）。
   ================================================================ */
var PD = {
  postId: null,
  post: null,
  comments: [],
  loading: false,
  error: "",
  expanded: true,
  tried: false
};

function pdFindPost(id) {
  var i, p, k;
  var arr = S.posts || [];
  for (i = 0; i < arr.length; i++) {
    p = arr[i];
    if (p && String(p.id) === String(id)) return p;
  }
  var cache = S.profileCache || {};
  for (k in cache) {
    if (!Object.prototype.hasOwnProperty.call(cache, k)) continue;
    var d = cache[k] || {};
    var list = Array.isArray(d.posts) ? d.posts : [];
    for (i = 0; i < list.length; i++) {
      p = list[i];
      if (p && String(p.id) === String(id)) return p;
    }
  }
  return null;
}

/* 正文富文本：转义后再把 #话题 / @提及 变成可点样式（先转义，安全） */
function pdLinkify(text) {
  var html = esc(String(text == null ? "" : text));
  html = html.replace(/#([\w\u4e00-\u9fa5]{1,30})/g, '<span class="topic">#$1</span>');
  html = html.replace(/@([A-Za-z0-9_]{1,20})/g, '<span class="topic">@$1</span>');
  return html;
}

/* 媒体：单图直接展示；多图做横向轮播（每张都保留，不再 slice(0,4)） */
function pdMediaHTML(atts) {
  atts = Array.isArray(atts) ? atts : [];
  if (!atts.length) return "";
  var inner = "";
  var dots = "";
  var imgs = 0;
  atts.forEach(function (a, i) {
    var src = mediaUrl(a.path);
    if (a.type === "video") {
      inner += '<div class="pd-slide"><video src="' + esc(src) + '" controls playsinline preload="metadata"></video></div>';
    } else {
      imgs++;
      inner += '<div class="pd-slide">' +
        '<img src="' + esc(src) + '" data-img="' + esc(src) + '" alt="" />' +
        (atts.length > 1 ? '<div class="pd-counter">' + (i + 1) + '/' + atts.length + '</div>' : '') +
        '</div>';
    }
  });
  if (imgs > 1) {
    for (var i = 0; i < imgs; i++) dots += '<i class="' + (i === 0 ? 'on' : '') + '"></i>';
    dots = '<div class="pd-dots">' + dots + '</div>';
  }
  return '<div class="pd-media" data-pd-media="1">' + inner + '</div>' + dots;
}

/* 引用推文 */
function pdQuoteHTML(p) {
  if (!p || !p.retweetOfPostId) return "";
  var origin = pdFindPost(p.retweetOfPostId);
  var who = origin
    ? ((S.accounts[origin.authorId] || {}).displayName || origin.authorDisplayName || origin.authorHandle || "未知作者")
    : "未知作者";
  var txt = origin ? (origin.text || "") : (p.retweetOfText || "");
  return '<div class="pd-quote">' +
    '<div class="pd-quote-head">' + esc(who) + ' 的推文</div>' +
    '<div class="pd-quote-text">' + pdLinkify(txt) + '</div>' +
    '</div>';
}

/* 互动数据 */
function pdStatsHTML(p, commentCount) {
  var rt = Number(p.retweetCount) || 0;
  var lk = Number(p.likeCount) || 0;
  var cm = Number(commentCount) || 0;
  return '<div class="pd-stats">' +
    '<span><b>' + fmtCount(rt) + '</b> 转发</span>' +
    '<span><b>' + fmtCount(lk) + '</b> 喜欢</span>' +
    '<span><b>' + fmtCount(cm) + '</b> 评论</span>' +
